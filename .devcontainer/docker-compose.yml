# ============================================
# Docker Compose 配置 - PLC & Python 开发环境
# 用于 VS Code Remote Containers
# ============================================

version: '3.8'

services:
  # ==================== 主开发环境容器 ====================
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        # 可在此处传递构建参数
        - USERNAME=vscode
        - USER_UID=1000
        - USER_GID=1000
    
    container_name: plc-python-dev-env
    hostname: dev-container
    
    # 使用 vscode 用户运行（更安全）
    user: vscode
    
    volumes:
      # 工作空间挂载（cached模式提升性能）
      - ..:/workspace:cached
      
      # Git配置持久化（可选，用于保持Git全局设置）
      - ~/.gitconfig:/home/vscode/.gitconfig:ro
      
      # SSH密钥挂载（用于GitHub等Git操作）
      - ~/.ssh:/home/vscode/.ssh:ro
      
      # Go模块缓存持久化（加速依赖下载）
      - go-mod-cache:/go/pkg/mod
      
      # Python包缓存持久化（加速pip安装）
      - pip-cache:/home/vscode/.cache/pip
      
      # VS Code扩展和设置持久化
      - vscode-extensions:/home/vscode/.vscode-server/extensions
      - vscode-settings:/home/vscode/.config/Code/User
    
    environment:
      # Python 环境变量
      - PYTHONPATH=/workspace
      - PIP_NO_CACHE_DIR=off
      - PIP_DISABLE_PIP_VERSION_CHECK=on
      
      # Go 环境变量
      - GOPATH=/go
      - GO111MODULE=auto
      
      # 语言和时区
      - LANG=zh_CN.UTF-8
      - LANGUAGE=zh_CN:zh
      - LC_ALL=zh_CN.UTF-8
      - TZ=Asia/Shanghai
      
      # 终端颜色支持
      - TERM=xterm-256color
      
      # Git配置（如果未挂载.gitconfig）
      - GIT_CONFIG_GLOBAL=/home/vscode/.gitconfig
    
    # 保持容器运行（VS Code Dev Containers需要）
    command: sleep infinity
    
    # 资源限制（可根据机器配置调整）
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 2G
          cpus: '1'
    
    # 网络配置
    networks:
      - dev-network
    
    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 60s
      timeout: 10s
      retries: 3

# ==================== 数据卷定义 ====================
volumes:
  go-mod-cache:
    name: plc-dev-go-mod-cache
  pip-cache:
    name: plc-dev-pip-cache
  vscode-extensions:
    name: plc-dev-vscode-extensions
  vscode-settings:
    name: plc-dev-vscode-settings

# ==================== 网络定义 ====================
networks:
  dev-network:
    name: plc-dev-network
    driver: bridge
