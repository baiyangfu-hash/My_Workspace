<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Bridge API 验证</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Microsoft YaHei", sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
h1 { color: #00d4ff; margin-bottom: 10px; font-size: 20px; }
.subtitle { color: #888; margin-bottom: 20px; font-size: 13px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 16px; }
.card h2 { color: #00d4ff; font-size: 14px; margin-bottom: 12px; border-bottom: 1px solid #0f3460; padding-bottom: 8px; }
.btn { display: inline-block; padding: 6px 14px; margin: 4px 2px; background: #0f3460; color: #e0e0e0; border: 1px solid #00d4ff; border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.2s; }
.btn:hover { background: #00d4ff; color: #1a1a2e; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.result { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 8px; margin-top: 8px; font-family: "Cascadia Code", monospace; font-size: 11px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
.result.ok { border-color: #238636; }
.result.err { border-color: #da3633; color: #ff7b72; }
.status-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0d1117; border-top: 1px solid #30363d; padding: 8px 20px; font-size: 12px; display: flex; justify-content: space-between; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-dot.green { background: #238636; }
.status-dot.red { background: #da3633; }
.status-dot.yellow { background: #d29922; }
.counter { color: #00d4ff; }
label { font-size: 12px; color: #888; display: block; margin-top: 6px; }
input, select { background: #0d1117; border: 1px solid #30363d; color: #e0e0e0; padding: 4px 8px; border-radius: 4px; font-size: 12px; width: 100%; margin-top: 2px; }
</style>
</head>
<body>

<h1>Bridge API 验证页面</h1>
<p class="subtitle">验证 JS → Python IPC 链路，每个按钮对应一个 API 调用</p>

<div class="grid">
  <!-- 项目总览 -->
  <div class="card">
    <h2>项目总览 API</h2>
    <button class="btn" onclick="testGetWorkspaceProjects()">1. get_workspace_projects()</button>
    <button class="btn" onclick="testGetProjectDetail()">2. get_project_detail("DJ-2026-005")</button>
    <button class="btn" onclick="testGetProjectChanges()">3. get_project_changes("DJ-2026-005")</button>
    <button class="btn" onclick="testRefreshCache()">4. refresh_cache()</button>
    <div id="overview-result" class="result">点击按钮测试...</div>
  </div>

  <!-- 变更管理 - 查询 -->
  <div class="card">
    <h2>变更管理 API — 查询</h2>
    <button class="btn" onclick="testListChangeRequests()">5. list_change_requests("DJ-2026-005")</button>
    <button class="btn" onclick="testListChangeRequestsFiltered()">6. list (status=draft)</button>
    <button class="btn" onclick="testGetChangeRequest()">7. get_change_request("CHG-DOCU-2026-001")</button>
    <button class="btn" onclick="testGetChangeRequestNotFound()">8. get (不存在)</button>
    <div id="query-result" class="result">点击按钮测试...</div>
  </div>

  <!-- 变更管理 - 创建 -->
  <div class="card">
    <h2>变更管理 API — 创建</h2>
    <label>领域: <select id="cr-domain"><option value="PLC">PLC</option><option value="ELEC">ELEC</option><option value="DOCU">DOCU</option></select></label>
    <label>性质: <select id="cr-nature"><option value="DEF">DEF</option><option value="REQ">REQ</option><option value="OPT">OPT</option></select></label>
    <label>范围: <select id="cr-scope"><option value="LOCAL">LOCAL</option><option value="MODULE">MODULE</option></select></label>
    <label>申请人: <input id="cr-applicant" value="BridgeTest" /></label>
    <label>背景: <input id="cr-background" value="Bridge验证测试创建" /></label>
    <label>必要性: <input id="cr-necessity" value="验证IPC链路" /></label>
    <button class="btn" onclick="testCreateChangeRequest()">9. create_change_request()</button>
    <button class="btn" onclick="testCreateChangeRequestBadDomain()">10. create (非法领域)</button>
    <div id="create-result" class="result">点击按钮测试...</div>
  </div>

  <!-- 变更管理 - 流转 -->
  <div class="card">
    <h2>变更管理 API — 状态流转</h2>
    <label>变更编号: <input id="tr-number" value="CHG-DOCU-2026-001" /></label>
    <label>目标状态: <select id="tr-status"><option value="under_review">under_review</option><option value="approved">approved</option><option value="implementing">implementing</option><option value="completed">completed</option><option value="draft">draft</option></select></label>
    <label>审批人: <input id="tr-approver" value="" /></label>
    <label>意见: <input id="tr-comment" value="" /></label>
    <button class="btn" onclick="testTransitionStatus()">11. transition_status()</button>
    <button class="btn" onclick="testTransitionGuardFail()">12. transition (门禁拦截)</button>
    <div id="transition-result" class="result">点击按钮测试...</div>
  </div>
</div>

<div class="status-bar">
  <span><span class="status-dot yellow" id="conn-dot"></span><span id="conn-text">等待连接...</span></span>
  <span>通过: <span class="counter" id="pass-count">0</span> / 失败: <span class="counter" id="fail-count">0</span></span>
</div>

<script>
let passCount = 0;
let failCount = 0;

function updateCounters() {
  document.getElementById('pass-count').textContent = passCount;
  document.getElementById('fail-count').textContent = failCount;
}

function setConnected(connected) {
  const dot = document.getElementById('conn-dot');
  const text = document.getElementById('conn-text');
  if (connected) {
    dot.className = 'status-dot green';
    text.textContent = 'Bridge 已连接';
  } else {
    dot.className = 'status-dot red';
    text.textContent = 'Bridge 未连接';
  }
}

async function callAPI(name, resultId, fn) {
  const el = document.getElementById(resultId);
  el.className = 'result';
  el.textContent = `调用 ${name}...`;
  try {
    const result = await fn();
    if (result && result.error) {
      el.className = 'result err';
      el.textContent = `[错误] ${result.error}: ${result.message}`;
      failCount++;
    } else {
      el.className = 'result ok';
      el.textContent = JSON.stringify(result, null, 2);
      passCount++;
    }
  } catch (e) {
    el.className = 'result err';
    el.textContent = `[异常] ${e.message || e}`;
    failCount++;
  }
  updateCounters();
}

// ── 项目总览 ──

async function testGetWorkspaceProjects() {
  await callAPI('get_workspace_projects', 'overview-result', async () => {
    return await window.pywebview.api.get_workspace_projects();
  });
}

async function testGetProjectDetail() {
  await callAPI('get_project_detail', 'overview-result', async () => {
    return await window.pywebview.api.get_project_detail('DJ-2026-005');
  });
}

async function testGetProjectChanges() {
  await callAPI('get_project_changes', 'overview-result', async () => {
    return await window.pywebview.api.get_project_changes('DJ-2026-005');
  });
}

async function testRefreshCache() {
  await callAPI('refresh_cache', 'overview-result', async () => {
    return await window.pywebview.api.refresh_cache(null);
  });
}

// ── 变更查询 ──

async function testListChangeRequests() {
  await callAPI('list_change_requests', 'query-result', async () => {
    return await window.pywebview.api.list_change_requests('DJ-2026-005', null);
  });
}

async function testListChangeRequestsFiltered() {
  await callAPI('list (status=draft)', 'query-result', async () => {
    return await window.pywebview.api.list_change_requests('DJ-2026-005', {status: 'draft'});
  });
}

async function testGetChangeRequest() {
  await callAPI('get_change_request', 'query-result', async () => {
    return await window.pywebview.api.get_change_request('CHG-DOCU-2026-001');
  });
}

async function testGetChangeRequestNotFound() {
  await callAPI('get (不存在)', 'query-result', async () => {
    return await window.pywebview.api.get_change_request('CHG-XXX-9999-000');
  });
}

// ── 变更创建 ──

async function testCreateChangeRequest() {
  const fields = {
    domain: document.getElementById('cr-domain').value,
    business_nature: document.getElementById('cr-nature').value,
    impact_scope: [document.getElementById('cr-scope').value],
    applicant: document.getElementById('cr-applicant').value,
    background: document.getElementById('cr-background').value,
    necessity: document.getElementById('cr-necessity').value,
  };
  await callAPI('create_change_request', 'create-result', async () => {
    return await window.pywebview.api.create_change_request('DJ-2026-005', fields);
  });
}

async function testCreateChangeRequestBadDomain() {
  const fields = {
    domain: 'INVALID',
    business_nature: 'DEF',
    impact_scope: ['LOCAL'],
    applicant: 'Test',
    background: 'Test',
    necessity: 'Test',
  };
  await callAPI('create (非法领域)', 'create-result', async () => {
    return await window.pywebview.api.create_change_request('DJ-2026-005', fields);
  });
}

// ── 状态流转 ──

async function testTransitionStatus() {
  const number = document.getElementById('tr-number').value;
  const status = document.getElementById('tr-status').value;
  const approver = document.getElementById('tr-approver').value;
  const comment = document.getElementById('tr-comment').value;
  const kwargs = {};
  if (approver) kwargs.approver = approver;
  if (comment) kwargs.comment = comment;
  await callAPI('transition_status', 'transition-result', async () => {
    return await window.pywebview.api.transition_status(number, status, kwargs);
  });
}

async function testTransitionGuardFail() {
  // 尝试把 draft 状态的变更单直接转到 completed（门禁必然失败）
  await callAPI('transition (门禁拦截)', 'transition-result', async () => {
    return await window.pywebview.api.transition_status('CHG-DOCU-2026-002', 'completed', {});
  });
}

// ── 初始化 ──

window.addEventListener('pywebviewready', function() {
  setConnected(true);
});
</script>

</body>
</html>
