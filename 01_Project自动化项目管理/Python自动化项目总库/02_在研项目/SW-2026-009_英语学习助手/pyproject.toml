[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "english_learning_app"
version = "0.1.0"
description = "纯本地离线运行的 Windows 英语学习应用"
authors = [
    { name = "fubai" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "click>=8.1",
    "rich>=14",
    "pyyaml>=6.0",
]

[project.urls]
homepage = "https://github.com/fubai/english_learning_app"
source = "https://github.com/fubai/english_learning_app"

[project.scripts]
english-learning-app = "english_learning_app.cli.__main__:cli"

[dependency-groups]
dev = [
    "mypy>=1,<2",
    "pre-commit>=3,<4",
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.5,<0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["english_learning_app"]

[tool.mypy]
strict = true
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "english_learning_app",
]
testpaths = ["tests"]
addopts = [
    "--cov=english_learning_app/",
    "--cov-report=term",
    "--cov-report=html:coverage/html",
    "--color=yes",
]

[tool.coverage.run]
omit = [
    "tests/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]
