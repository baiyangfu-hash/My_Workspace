<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>auto-pm | V6 全功能高保真原型 (双轨制工作域)</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- ==========================================
         ============= 1. 核心样式体系 ============= 
         ========================================== -->
    <style>
        :root {
            --bg-base: #020617;
            --bg-gradient-1: #1e1b4b;
            --bg-gradient-2: #0f172a;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #38bdf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-bg-hover: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --sidebar-width: 280px;
            --header-height: 72px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', "Microsoft YaHei", sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        /* 氛围光晕 */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.5;
            animation: float 20s infinite ease-in-out alternate;
            pointer-events: none;
        }

        .orb-1 {
            top: -10%;
            left: -5%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
        }

        .orb-2 {
            bottom: -20%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, var(--secondary) 0%, transparent 70%);
            animation-delay: -10s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(5%, 5%) scale(1.1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 基础组件 */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: var(--radius-lg);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            font-size: 14px;
        }

        .btn:hover {
            background: #4f46e5;
            box-shadow: 0 4px 12px var(--primary-glow);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
        }

        .btn-outline:hover {
            background: var(--glass-bg-hover);
            box-shadow: none;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 8px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
        }

        .tag.error {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .tag.warn {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .tag.success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .tag.primary {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        /* 布局骨架 */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--glass-border);
            background: rgba(2, 6, 23, 0.6);
            backdrop-filter: blur(20px);
            z-index: 20;
        }

        .logo-area {
            height: var(--header-height);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding: 0 24px;
            border-bottom: 1px solid var(--glass-border);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-text-fill-color: white;
            font-size: 18px;
        }

        .sidebar-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .sidebar-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .nav-section-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 8px;
            padding-left: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
            list-style: none;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition-smooth);
            cursor: pointer;
            border: 1px solid transparent;
        }

        .nav-item-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-item-content i {
            font-size: 18px;
        }

        .nav-item:hover {
            background: var(--glass-bg-hover);
            color: var(--text-main);
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0.02) 100%);
            color: var(--text-main);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: inset 3px 0 0 var(--primary);
        }

        .nav-item.active i {
            color: var(--primary);
            text-shadow: 0 0 12px var(--primary-glow);
        }

        .project-context-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .project-context-card .pj-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .project-context-card .pj-id {
            font-size: 11px;
            color: var(--primary);
            font-family: monospace;
        }

        .main-content {
            flex: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        .header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(2, 6, 23, 0.4);
            backdrop-filter: blur(10px);
        }

        .router-view {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 0.4s ease-out;
        }

        .router-view::-webkit-scrollbar {
            width: 6px;
        }

        .router-view::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 10px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 20px;
            width: 300px;
            transition: var(--transition-smooth);
        }

        .search-bar:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            background: rgba(255, 255, 255, 0.06);
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            width: 100%;
            font-family: inherit;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 8px;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        /* Dashboard 组件 */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .kpi-card {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .kpi-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
        }

        .kpi-card:hover::before {
            opacity: 1;
        }

        .kpi-value {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .dashboard-main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            min-height: 400px;
        }

        /* 状态机 */
        .state-machine {
            padding: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .sm-line {
            position: absolute;
            top: 50%;
            left: 32px;
            right: 32px;
            height: 2px;
            background: var(--glass-border);
            z-index: 1;
            transform: translateY(-50%);
        }

        .sm-line-active {
            position: absolute;
            top: 50%;
            left: 32px;
            width: 0%;
            height: 2px;
            background: var(--primary);
            z-index: 2;
            transform: translateY(-50%);
            box-shadow: 0 0 10px var(--primary);
            transition: width 0.8s ease-out;
        }

        .sm-node {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .sm-node:hover {
            transform: translateY(-5px);
        }

        .sm-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-gradient-2);
            border: 2px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text-muted);
            transition: var(--transition-smooth);
        }

        .sm-node.done .sm-circle {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: var(--success);
        }

        .sm-node.active .sm-circle {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(99, 102, 241, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0);
            }
        }

        /* 通用 Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .data-table th {
            padding: 12px 16px;
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-weight: 500;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            font-size: 14px;
            transition: background 0.2s;
        }

        .data-table tr:hover td {
            background: rgba(255, 255, 255, 0.04);
            cursor: pointer;
        }

        /* 变量表专属 Data Grid */
        .grid-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }

        .var-grid-container {
            flex: 1;
            overflow: auto;
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            position: relative;
        }

        .var-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .var-table th,
        .var-table td {
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
        }

        .var-table th {
            background: #0f172a;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            position: sticky;
            top: 0;
            z-index: 10;
            user-select: none;
        }

        .var-table td {
            padding: 6px 12px;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            background: transparent;
        }

        .var-table tr:nth-child(even) td {
            background: rgba(0, 0, 0, 0.15);
        }

        .var-table tr:hover td {
            background: rgba(99, 102, 241, 0.1);
        }

        .var-table td.editable:hover {
            outline: 1px solid var(--primary);
            outline-offset: -1px;
            cursor: text;
            background: rgba(0, 0, 0, 0.4);
        }

        .type-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .type-bool {
            background: #38bdf8;
        }

        .type-int {
            background: #10b981;
        }

        .type-real {
            background: #a855f7;
        }

        .type-string {
            background: #f59e0b;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-smooth);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 480px;
            transform: translateY(20px);
            transition: var(--transition-smooth);
            padding: 32px;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        /* 布局卡片网格 */
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card-file {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: var(--transition-smooth);
            cursor: pointer;
        }

        .card-file:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>

    <!-- 氛围光晕 -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <!-- ==========================================
         ============= 2. 核心骨架 (Shell) ============= 
         ========================================== -->
    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo-icon"><i class="ph-bold ph-hexagon"></i></div>
            auto-pm
        </div>

        <div class="sidebar-scroll">
            <!-- 第一轨：平台自身研发管控 (PLATFORM COCKPIT) -->
            <div id="nav-platform">
                <div class="nav-section-title">PLATFORM COCKPIT <i class="ph-bold ph-rocket-launch"></i></div>
                <div class="project-context-card" style="background: rgba(99,102,241,0.1); border-color:var(--primary);">
                    <div class="pj-name">auto-pm 研发管理平台</div>
                    <div class="pj-id">SW-2026-008</div>
                </div>
                <ul class="nav-menu">
                    <li class="nav-item active" data-route="platform-dashboard">
                        <div class="nav-item-content"><i class="ph ph-gauge"></i> 平台驾驶舱大盘</div>
                    </li>
                    <li class="nav-item" data-route="platform-changes">
                        <div class="nav-item-content"><i class="ph ph-git-merge"></i> 平台变更管控</div>
                        <span class="tag warn" style="border-radius:12px; padding:2px 8px;">2 待办</span>
                    </li>
                    <li class="nav-item" data-route="platform-specs">
                        <div class="nav-item-content"><i class="ph ph-shield-check"></i> 平台架构规范检查</div>
                    </li>
                    <li class="nav-item" data-route="platform-delivery">
                        <div class="nav-item-content"><i class="ph ph-presentation-chart"></i> 平台迭代与发布</div>
                    </li>
                </ul>
            </div>

            <div style="height: 1px; background: var(--glass-border); margin: 8px 0;"></div>

            <!-- 第二轨：桥梁 (WORKSPACE) -->
            <div id="nav-global">
                <div class="nav-section-title">WORKSPACE <i class="ph-bold ph-globe"></i></div>
                <ul class="nav-menu">
                    <li class="nav-item" data-route="projects">
                        <div class="nav-item-content"><i class="ph ph-squares-four"></i> 业务项目大厅</div>
                        <span class="tag" style="background:rgba(255,255,255,0.05)">11</span>
                    </li>
                </ul>
            </div>

            <div style="height: 1px; background: var(--glass-border); margin: 8px 0;"></div>

            <!-- 第三轨：具体业务工程管控 (ACTIVE PROJECT) -->
            <div id="nav-project">
                <div class="nav-section-title" style="color:var(--secondary)">ACTIVE BUSINESS PROJECT <i class="ph-bold ph-cpu"></i></div>
                <div class="project-context-card" style="border-color:var(--secondary);">
                    <span class="pj-name">PLC_标准化功能块库</span>
                    <span class="pj-id">SW-2025-102</span>
                </div>
                <ul class="nav-menu">
                    <li class="nav-item" data-route="project-dashboard">
                        <div class="nav-item-content"><i class="ph ph-chart-pie-slice"></i> 工程健康度概览</div>
                    </li>
                    <li class="nav-item" data-route="vartables">
                        <div class="nav-item-content"><i class="ph ph-table"></i> 变量表与 IO 资产</div>
                    </li>
                    <li class="nav-item" data-route="project-changes">
                        <div class="nav-item-content"><i class="ph ph-git-branch"></i> 工程变更控制矩阵</div>
                    </li>
                    <li class="nav-item" data-route="project-specs">
                        <div class="nav-item-content"><i class="ph ph-shield-check"></i> 工程规范与死区检查</div>
                    </li>
                    <li class="nav-item" data-route="project-delivery">
                        <div class="nav-item-content"><i class="ph ph-rocket-launch"></i> 工程交付与试运行报告</div>
                    </li>
                </ul>
            </div>

            <div style="margin-top: auto;">
                <ul class="nav-menu">
                    <li class="nav-item" data-route="settings">
                        <div class="nav-item-content"><i class="ph ph-gear"></i> 全局系统设置</div>
                    </li>
                </ul>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="header">
            <div class="search-bar">
                <i class="ph ph-magnifying-glass" style="color: var(--text-muted)"></i>
                <input type="text" placeholder="搜索功能块、变量地址、变更单号...">
                <kbd
                    style="font-size:10px; padding:2px 6px; background:rgba(255,255,255,0.1); border-radius:4px; color:var(--text-muted)">Ctrl+K</kbd>

                { id: "CHG-PLC-045", title: "S7-1500 报警块接口扩容", author: "john", status: "Review", tag: "warning", date: "2026-06-25", desc: "增加 32 个报警字支持，优化 HMI 联动性能。" }
            ],
            specs: [
                { rule: "LSP-SCL-001", desc: "FB 功能块内部变量必须使用前缀 'stat_'", loc: "MotorControl_FB.scl : L24", status: "error" },
                { rule: "LSP-DB-015", desc: "全局 DB 取消勾选 Optimized Block Access", loc: "HMI_Data.db", status: "error" },
                { rule: "LSP-DOC-003", desc: "PM_SESSION 必须包含 [技术债] 章节", loc: "PM_SESSION.md", status: "pass" },
                { rule: "LSP-QML-012", desc: "QML 中禁止无兜底的 undefined 属性绑定", loc: "VarTableEditor.qml : L259", status: "pass" }
            ]
        };

        /**
         * [CONTROLLER] 应用核心控制器
         */
        class Application {
            constructor() {
                this.viewContainer = document.getElementById('app-view');
                this.modal = document.getElementById('sys-modal');
                this.navItems = document.querySelectorAll('.nav-item');
                this.bindEvents();

                // 默认路由
                this.navigate('platform-dashboard');
            }

            bindEvents() {
                this.navItems.forEach(item => {
                    item.addEventListener('click', (e) => {
                        this.navItems.forEach(n => n.classList.remove('active'));
                        e.currentTarget.classList.add('active');
                        this.navigate(e.currentTarget.dataset.route);
                    });
                });
            }

            navigate(route) {
                this.viewContainer.innerHTML = '';
                const template = document.getElementById(`view-${route}`);
                if (template) {
                    this.viewContainer.appendChild(template.content.cloneNode(true));
                    if (this[`init_${route.replace('-', '_')}`]) this[`init_${route.replace('-', '_')}`]();
                } else {
                    this.viewContainer.innerHTML = `
                        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text-muted); opacity:0.6;">
                            <i class="ph-bold ph-cone" style="font-size:64px; margin-bottom:16px;"></i>
                            <h2 style="font-weight:500;">模块 [${route}] 开发建设中...</h2>
                        </div>
                    `;
                }
            }

            // --- 模块初始化逻辑 ---

            init_projects() {
                const tbody = document.getElementById('projects-tbody');
                let html = '';
                Database.projects.forEach(p => {
                    const statusClass = p.status === 'production' ? 'success' : (p.status === 'developing' ? 'primary' : 'warning');
                    html += `
                        <tr>
                            <td style="font-family:monospace; color:var(--primary); font-weight:600; font-size:13px;">${p.id}</td>
                            <td>
                                <div style="font-weight:500; margin-bottom:4px; font-size:14px;">${p.name}</div>
                                <div style="font-size:11px; color:var(--text-muted);">${p.path}</div>
                            </td>
                            <td style="font-size:13px; color:var(--text-muted);">${p.stack}</td>
                            <td><span class="tag ${statusClass}">${p.status}</span></td>
                            <td style="font-size:13px; color:var(--text-muted);">${p.activity}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            }

            
            init_project_changes() {
                // Populate Ledger
                const tbody = document.getElementById('proj-ledger-tbody');
                if(tbody) {
                    let html = '';
                    const ledgerData = [
                        { seq: "021", id: "CHG-PLC-2026-001", domain: "PLC", applicant: "张工", date: "2026-07-08", desc: "修复FB_ValveControl状态机死锁问题", done: "-", status: "🔄实施中", statusClass: "warn" },
                        { seq: "020", id: "CHG-HMI-2026-003", domain: "HMI", applicant: "王工", date: "2026-07-06", desc: "增加主控画面手动模式二次确认弹窗", done: "2026-07-07", status: "✅已关闭", statusClass: "success" },
                        { seq: "019", id: "CHG-ELEC-2026-002", domain: "ELEC", applicant: "李工", date: "2026-07-01", desc: "伺服驱动器选型变更，电气图纸接线脚位调整", done: "2026-07-03", status: "✅已归档", statusClass: "success" }
                    ];
                    ledgerData.forEach(r => {
                        html += `
                            <tr class="table-row">
                                <td style="color:var(--text-muted)">${r.seq}</td>
                                <td style="color:var(--primary); font-family:monospace">${r.id}</td>
                                <td><span class="tag">${r.domain}</span></td>
                                <td>${r.applicant}</td>
                                <td style="font-family:monospace; font-size:13px;">${r.date}</td>
                                <td>${r.desc}</td>
                                <td style="font-family:monospace; font-size:13px; color:var(--text-muted)">${r.done}</td>
                                <td><span class="tag ${r.statusClass}">${r.status}</span></td>
                            </tr>
                        `;
                    });
                    tbody.innerHTML = html;
                }

                // Populate Traceability
                const traceContainer = document.getElementById('proj-trace-timeline');
                if(traceContainer) {
                    const traceData = [
                        { from: "Draft", to: "Review", approver: "张工", date: "2026-07-08 09:00", comment: "初步方案已完成" },
                        { from: "Review", to: "Implementing", approver: "PM_System", date: "2026-07-08 10:15", comment: "评审通过，准许实施" }
                    ];
                    let html = '<div style="display:flex; flex-direction:column; gap:20px; position:relative;">';
                    traceData.forEach((item, index) => {
                        html += `
                            <div style="display:flex; gap:16px; position:relative;">
                                ${index !== traceData.length - 1 ? '<div style="position:absolute; left:5px; top:20px; bottom:-20px; width:1px; background:var(--glass-border);"></div>' : ''}
                                <div style="width:11px; height:11px; border-radius:50%; background:var(--primary); box-shadow:0 0 8px var(--primary); margin-top:4px; position:relative; z-index:2;"></div>
                                <div>
                                    <div style="font-size:13px; margin-bottom:4px;"><b>${item.from}</b> &rarr; <b>${item.to}</b></div>
                                    <div style="font-size:12px; color:var(--text-muted); line-height:1.5;">
                                        操作人: ${item.approver} <br>
                                        时间: ${item.date} <br>
                                        意见: ${item.comment}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    traceContainer.innerHTML = html;
                }
                
                // Ensure correct styling for initial tab
                setTimeout(() => {
                    const tabLedgerBtn = document.querySelector('[data-tab="tab-ledger"]');
                    if(tabLedgerBtn) tabLedgerBtn.style.borderBottom = '2px solid var(--primary)';
                }, 50);
            }

            switchProjectChangeTab(tabId, btnElement) {
                // Hide all contents
                document.querySelectorAll('.proj-tab-content').forEach(el => el.style.display = 'none');
                // Remove active styling from all buttons
                document.querySelectorAll('.proj-tab-btn').forEach(btn => {
                    btn.classList.remove('active');
                    btn.style.borderBottom = 'none';
                    btn.style.color = 'var(--text-muted)';
                });
                
                // Show selected content
                document.getElementById(tabId).style.display = 'block';
                // Add active styling to clicked button
                btnElement.classList.add('active');
                btnElement.style.borderBottom = '2px solid var(--primary)';
                btnElement.style.color = 'var(--text-main)';
            }

            init_platform_dashboard() {
                this.renderTimeline();
            }

            renderTimeline() {
                const container = document.getElementById('timeline-container');
                if (!container) return;
                let html = '<div style="display:flex; flex-direction:column; gap:20px; position:relative;">';
                Database.timeline.forEach((item, index) => {
                    const colorMap = { success: 'var(--success)', warning: 'var(--warning)', default: 'var(--primary)' };
                    const color = colorMap[item.type] || colorMap.default;
                    html += `
                        <div style="display:flex; gap:16px; position:relative;">
                            ${index !== Database.timeline.length - 1 ? '<div style="position:absolute; left:5px; top:20px; bottom:-20px; width:1px; background:var(--glass-border);"></div>' : ''}
                            <div style="width:11px; height:11px; border-radius:50%; background:${color}; box-shadow:0 0 8px ${color}; margin-top:4px; position:relative; z-index:2;"></div>
                            <div style="display:flex; flex-direction:column; gap:4px;">
                                <div style="font-size:14px; font-weight:500; color:var(--text-main);">${item.title}</div>
                                <div style="font-size:13px; color:var(--text-muted); line-height:1.5;">${item.desc}</div>
                                <div style="font-size:11px; color:var(--text-muted); opacity:0.6; margin-top:2px;">${item.time}</div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            }

            simulateStateChange() {
                const bar = document.getElementById('sm-progress');
                if (bar) bar.style.width = '75%';

                const nodeImplementing = document.getElementById('node-implementing');
                if (nodeImplementing) {
                    nodeImplementing.classList.remove('active'); nodeImplementing.classList.add('done');
                    nodeImplementing.innerHTML = '<div class="sm-circle"><i class="ph-bold ph-code"></i></div><div style="font-size:12px; margin-top:8px; color:var(--text-muted);">实施中 (Implementing)</div>';
                }
                const nodeCompleted = document.getElementById('node-completed');
                if (nodeCompleted) nodeCompleted.classList.add('active');

                Database.timeline.unshift({ type: 'success', title: '状态流转: Implementing -> Closed', desc: 'CHG-102 闭环完成并归档至 PM_SESSION。', time: '刚刚' });
                this.renderTimeline();
                this.showModal("模拟流转成功", "状态机已流转至【Closed】。");
            }

            init_platform_changes() {
                this.init_project_changes();
                this.renderLedger();
            }

            toggleChangeView(type) {
                const split = this.viewContainer.querySelector('#change-view-split');
                const ledger = this.viewContainer.querySelector('#change-view-ledger');
                const btnSplit = document.getElementById('btn-view-split');
                const btnLedger = document.getElementById('btn-view-ledger');

                if (type === 'split') {
                    split.style.display = 'flex';
                    ledger.style.display = 'none';
                    btnSplit.style.background = 'var(--primary)';
                    btnLedger.style.background = 'transparent';
                } else {
                    split.style.display = 'none';
                    ledger.style.display = 'flex';
                    btnSplit.style.background = 'transparent';
                    btnLedger.style.background = 'var(--primary)';
                }
            }

            renderLedger() {
                const tbody = document.getElementById('ledger-tbody');
                if (!tbody) return;
                let html = '';
                Database.changes.forEach(c => {
                    const tagClass = c.tag === 'primary' ? 'primary' : (c.tag === 'success' ? 'success' : 'warn');
                    html += `
                        <tr>
                            <td style="font-family:monospace; color:var(--primary); font-size:13px;">${c.id}</td>
                            <td style="font-weight:500;">${c.title}</td>
                            <td style="font-size:13px; color:var(--text-muted);">SW-2026-008</td>
                            <td>${c.author}</td>
                            <td style="font-size:13px; color:var(--text-muted);">${c.date}</td>
                            <td style="font-size:13px; color:var(--text-muted);">${c.status === 'Closed' ? '2026-07-08' : '-'}</td>
                            <td><span class="tag ${tagClass}">${c.status}</span></td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            }

            init_project_changes() {
                const listContainer = document.getElementById('changes-list');
                if (!listContainer) return;

                let html = '';
                Database.changes.forEach(c => {
                    const tagClass = c.tag === 'primary' ? 'primary' : (c.tag === 'success' ? 'success' : 'warn');
                    html += `
                        <div class="project-context-card" style="padding:12px; margin-bottom:12px; cursor:pointer; background:rgba(255,255,255,0.02);" onclick="app.showChangeDetail('${c.id}')" onmouseover="this.style.background='rgba(255,255,255,0.06)'" onmouseout="this.style.background='rgba(255,255,255,0.02)'">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                                <span style="font-family:monospace; font-size:12px; color:var(--primary); font-weight:600;">${c.id}</span>
                                <span class="tag ${tagClass}">${c.status}</span>
                            </div>
                            <div style="font-weight:500; font-size:14px; margin-bottom:6px; line-height:1.4;">${c.title}</div>
                            <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted);">
                                <span><i class="ph-bold ph-user" style="margin-right:2px"></i> ${c.author}</span>
                                <span>${c.date}</span>
                            </div>
                        </div>
                    `;
                });
                listContainer.innerHTML = html;
            }

            showChangeDetail(id) {
                const c = Database.changes.find(x => x.id === id);
                const detailView = document.getElementById('change-detail-view');
                if (c && detailView) {
                    const tagClass = c.tag === 'primary' ? 'primary' : (c.tag === 'success' ? 'success' : 'warn');
                    detailView.innerHTML = `
                        <div style="padding:24px; border-bottom:1px solid var(--glass-border); display:flex; justify-content:space-between; align-items:flex-start; background:rgba(0,0,0,0.2);">
                            <div>
                                <div style="font-family:monospace; font-size:13px; color:var(--primary); margin-bottom:8px;">${c.id}</div>
                                <h2 style="font-size:22px; font-weight:600; line-height:1.4;">${c.title}</h2>
                            </div>
                            <span class="tag ${tagClass}" style="font-size:12px; padding:4px 10px;">${c.status}</span>
                        </div>
                        <div style="flex:1; padding:24px; overflow-y:auto; color:var(--text-main); font-size:14px; line-height:1.7;">
                            <div style="display:flex; gap:24px; margin-bottom:24px; color:var(--text-muted); font-size:13px; background:rgba(255,255,255,0.02); padding:12px; border-radius:8px;">
                                <div><strong>创建人:</strong> ${c.author}</div>
                                <div><strong>创建日期:</strong> ${c.date}</div>
                                <div><strong>所属项目:</strong> SW-2026-008</div>
                            </div>
                            
                            <h3 style="font-size:16px; margin-bottom:12px; border-bottom:1px solid var(--glass-border); padding-bottom:8px;">变更描述 (Description)</h3>
                            <p style="color:var(--text-muted); margin-bottom:24px;">${c.desc}</p>
                            
                            <h3 style="font-size:16px; margin-bottom:12px; border-bottom:1px solid var(--glass-border); padding-bottom:8px;">实施记录 (Implementation Log)</h3>
                            <div style="font-family:monospace; font-size:13px; background:#0f172a; padding:16px; border-radius:8px; border:1px solid rgba(255,255,255,0.05);">
                                [2026-07-08 10:00] user=fubai action=create_draft<br>
                                [2026-07-08 10:15] user=fubai action=transition to Review<br>
                                [2026-07-08 10:45] user=fubai action=transition to Implementing
                            </div>
                        </div>
                        <div style="padding:16px 24px; border-top:1px solid var(--glass-border); background:rgba(0,0,0,0.2); display:flex; justify-content:flex-end; gap:12px;">
                            <button class="btn btn-outline">编辑内容</button>
                            <button class="btn" onclick="app.showModal('推进状态', '将流转到下一阶段。')">流转阶段 (Transition)</button>
                        </div>
                    `;
                }
            }

            init_specs() {
                const tbody = document.getElementById('specs-tbody');
                if (!tbody) return;
                let html = '';
                Database.specs.forEach(s => {
                    const isError = s.status === 'error';
                    const tagClass = isError ? 'error' : 'success';
                    const tagText = isError ? '违规' : '通过';
                    const actionBtn = isError ? `<button class="btn btn-outline btn-sm"><i class="ph-bold ph-wrench"></i> Auto Fix</button>` : `<span style="color:var(--text-muted)">-</span>`;

                    html += `
                        <tr>
                            <td style="font-family:monospace; font-size:12px; color:${isError ? 'var(--danger)' : 'var(--text-muted)'};">${s.rule}</td>
                            <td style="color:var(--text-main);">${s.desc}</td>
                            <td style="font-size:13px; color:var(--text-muted); font-family:monospace;">${s.loc}</td>
                            <td><span class="tag ${tagClass}">${tagText}</span></td>
                            <td>${actionBtn}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            }

            runSpecScan() {
                const btn = document.getElementById('btn-scan');
                const bar = document.getElementById('scan-bar');
                const pct = document.getElementById('scan-pct');
                if (!btn || !bar || !pct) return;

                btn.innerHTML = `<i class="ph-bold ph-spinner" style="animation: spin 1s linear infinite;"></i> 扫描中...`;
                bar.style.width = '0%';
                bar.style.background = 'var(--primary)';
                pct.innerText = '0% (执行语法树解析)';

                setTimeout(() => { bar.style.width = '50%'; pct.innerText = '50% (检查规则引擎)'; }, 600);
                setTimeout(() => {
                    bar.style.width = '100%';
                    bar.style.background = 'var(--warning)';
                    pct.innerText = '100% (发现 2 项违规未修复)';
                    btn.innerHTML = `<i class="ph-bold ph-play"></i> 重新扫描`;
                }, 1200);
            }

            // --- 公共功能 ---
            showModal(title = "提示", body = "") {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-body').innerText = body;
                this.modal.classList.add('active');
            }

            closeModal(e) {
                if (e && e.target !== this.modal) return;
                this.modal.classList.remove('active');
            }
        }

        // --- 全局注入样式动画 ---
        const style = document.createElement('style');
        style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
        document.head.appendChild(style);

        // 启动应用
        const app = new Application();
    </script>
</body>

</html>
