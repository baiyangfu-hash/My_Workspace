<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>auto-pm GUI 原型 - 可点击交互</title>
<style>
  :root {
    --bg: #1e1e2e; --surface: #313244; --surface2: #45475a;
    --text: #cdd6f4; --text-dim: #a6adc8; --primary: #89b4fa;
    --green: #a6e3a1; --yellow: #f9e2af; --red: #f38ba8; --mauve: #cba6f7;
    --border: #585b70; --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; font-size: 14px; }

  /* ── 顶部工具栏 ── */
  .toolbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .toolbar .logo { font-weight: 700; color: var(--primary); font-size: 16px; white-space: nowrap; }
  .search-box { flex: 1; max-width: 400px; padding: 6px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 13px; }
  .search-box:focus { outline: none; border-color: var(--primary); }
  .filter-select { padding: 6px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); cursor: pointer; }
  .btn { padding: 6px 14px; border: none; border-radius: var(--radius); cursor: pointer; font-size: 13px; transition: opacity .2s; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--primary); color: var(--bg); font-weight: 600; }
  .btn-ghost { background: var(--surface2); color: var(--text); }
  .btn-danger { background: var(--red); color: var(--bg); }
  .btn-icon { padding: 6px 10px; background: var(--surface2); color: var(--text); }

  /* ── 主区域 ── */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* ── 左侧列表 ── */
  .sidebar { width: 320px; min-width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sidebar-header { padding: 10px 14px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
  .project-list { flex: 1; overflow-y: auto; }
  .project-card { padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s; }
  .project-card:hover { background: var(--surface2); }
  .project-card.active { background: var(--surface2); border-left: 3px solid var(--primary); }
  .project-card .pid { font-weight: 600; color: var(--primary); font-size: 13px; }
  .project-card .pname { color: var(--text); margin: 2px 0; font-size: 13px; }
  .project-card .pmeta { display: flex; gap: 8px; font-size: 11px; color: var(--text-dim); }
  .badge { padding: 1px 6px; border-radius: 4px; font-size: 10px; }
  .badge-plc { background: var(--yellow); color: var(--bg); }
  .badge-python { background: var(--green); color: var(--bg); }
  .badge-unknown { background: var(--surface2); color: var(--text-dim); }
  .badge-phase { background: var(--mauve); color: var(--bg); }

  /* ── 右侧详情 ── */
  .detail { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .detail-header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .detail-header h2 { font-size: 18px; color: var(--text); }
  .detail-header .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .tabs { display: flex; gap: 0; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .tab { padding: 10px 18px; cursor: pointer; color: var(--text-dim); border-bottom: 2px solid transparent; font-size: 13px; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab-content { flex: 1; overflow-y: auto; padding: 20px; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* ── 概览 ── */
  .info-grid { display: grid; grid-template-columns: 120px 1fr; gap: 8px 16px; margin-bottom: 24px; }
  .info-grid .label { color: var(--text-dim); font-size: 13px; }
  .info-grid .value { color: var(--text); font-size: 13px; }
  .section-title { font-size: 14px; color: var(--primary); margin: 20px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .activity-item { padding: 6px 0; font-size: 13px; color: var(--text-dim); border-bottom: 1px solid var(--surface2); }
  .activity-item .date { color: var(--mauve); margin-right: 8px; }

  /* ── 变更表格 ── */
  .chg-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .chg-table th { text-align: left; padding: 8px 10px; color: var(--text-dim); border-bottom: 1px solid var(--border); font-weight: 600; }
  .chg-table td { padding: 8px 10px; border-bottom: 1px solid var(--surface2); }
  .chg-table tr:hover { background: var(--surface); }
  .status-tag { padding: 2px 8px; border-radius: 4px; font-size: 11px; }
  .status-draft { background: var(--surface2); color: var(--text-dim); }
  .status-implementing { background: var(--yellow); color: var(--bg); }
  .status-completed { background: var(--green); color: var(--bg); }

  /* ── 状态栏 ── */
  .statusbar { display: flex; align-items: center; gap: 16px; padding: 6px 16px; background: var(--surface); border-top: 1px solid var(--border); font-size: 12px; color: var(--text-dim); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

  /* ── 弹窗 ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; justify-content: center; align-items: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius); padding: 24px; width: 480px; max-width: 90vw; }
  .modal h3 { margin-bottom: 16px; color: var(--primary); }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .form-group .hint { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .form-input { width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 13px; }
  .form-input:focus { outline: none; border-color: var(--primary); }
  .radio-group { display: flex; gap: 16px; }
  .radio-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: var(--text); }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .preview-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; font-size: 12px; color: var(--green); margin-top: 8px; }

  /* ── 空状态/加载/错误 ── */
  .state-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .state-icon { font-size: 48px; }
  .state-title { font-size: 18px; color: var(--text); }
  .state-desc { font-size: 13px; color: var(--text-dim); text-align: center; max-width: 360px; }
  .spinner { width: 24px; height: 24px; border: 3px solid var(--surface2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 状态切换器（原型调试用） ── */
  .state-switcher { position: fixed; bottom: 40px; right: 16px; display: flex; gap: 4px; z-index: 200; }
  .state-switcher button { padding: 4px 10px; font-size: 11px; background: var(--mauve); color: var(--bg); border: none; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>

<!-- ═══ 顶部工具栏 ═══ -->
<div class="toolbar">
  <span class="logo">[auto-pm]</span>
  <input class="search-box" id="search" placeholder="搜索项目编号或名称..." oninput="filterProjects()">
  <select class="filter-select" id="filterStack" onchange="filterProjects()">
    <option value="">全部技术栈</option>
    <option value="plc">PLC</option>
    <option value="python">Python</option>
  </select>
  <select class="filter-select" id="filterPhase" onchange="filterProjects()">
    <option value="">全部阶段</option>
    <option value="developing">开发中</option>
    <option value="commissioning">调试中</option>
    <option value="production">生产中</option>
    <option value="archived">已归档</option>
  </select>
  <button class="btn btn-primary" onclick="openCreateModal()">+ 新建</button>
  <button class="btn btn-ghost" onclick="rescan()">↻ 刷新</button>
  <button class="btn btn-icon" onclick="alert('设置: 工作空间路径、扫描深度、DB路径')">⚙</button>
</div>

<!-- ═══ 主区域 ═══ -->
<div class="main" id="mainArea">
  <!-- 左侧项目列表 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span>项目列表 (<span id="projectCount">0</span>)</span>
      <span id="scanIndicator"></span>
    </div>
    <div class="project-list" id="projectList"></div>
  </div>

  <!-- 右侧详情 -->
  <div class="detail" id="detailArea">
    <div class="detail-header">
      <h2 id="detailTitle">请选择左侧项目</h2>
      <div class="sub" id="detailSub"></div>
    </div>
    <div class="tabs" id="tabsBar" style="display:none;">
      <div class="tab active" onclick="switchTab('overview')">概览</div>
      <div class="tab" onclick="switchTab('changes')">变更 (<span id="chgCount">0</span>)</div>
      <div class="tab" onclick="switchTab('docs')">文档</div>
      <div class="tab" onclick="switchTab('check')">规范检查</div>
    </div>
    <div class="tab-content" id="tabContent">
      <div class="state-screen">
        <div class="state-icon">👈</div>
        <div class="state-title">未选择项目</div>
        <div class="state-desc">从左侧列表选择一个项目查看详情</div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ 状态栏 ═══ -->
<div class="statusbar">
  <span class="status-dot" id="statusDot"></span>
  <span id="statusText">已同步</span>
  <span>|</span>
  <span id="statProjects">0 个项目</span>
  <span>|</span>
  <span id="statChanges">0 个变更单</span>
  <span>|</span>
  <span>DB: .auto-pm/index.db</span>
  <span>|</span>
  <span id="lastScan">上次扫描: --</span>
</div>

<!-- ═══ 新建项目弹窗 ═══ -->
<div class="modal-overlay" id="createModal">
  <div class="modal">
    <h3>新建项目</h3>
    <div class="form-group">
      <label>项目编号 *</label>
      <input class="form-input" id="newId" placeholder="SW-2026-009" oninput="updatePreview()">
      <div class="hint">格式: 字母-年份-序号（如 SW-2026-009）</div>
    </div>
    <div class="form-group">
      <label>项目名称 *</label>
      <input class="form-input" id="newName" placeholder="新项目" oninput="updatePreview()">
    </div>
    <div class="form-group">
      <label>技术栈 *</label>
      <div class="radio-group">
        <label><input type="radio" name="stack" value="plc" checked onchange="updateTemplate()"> PLC</label>
        <label><input type="radio" name="stack" value="python" onchange="updateTemplate()"> Python</label>
      </div>
    </div>
    <div class="form-group">
      <label>模板</label>
      <select class="form-input" id="newTemplate">
        <option value="plc-standard">plc-standard（标准PLC项目）</option>
        <option value="plc-syslib-fb">plc-syslib-fb（SysLib FB项目）</option>
      </select>
    </div>
    <div class="form-group">
      <label>描述</label>
      <input class="form-input" id="newDesc" placeholder="一句话描述项目用途">
    </div>
    <div class="form-group">
      <label>作者</label>
      <input class="form-input" id="newAuthor" placeholder="fubai">
    </div>
    <div class="preview-box" id="pathPreview">预览路径: 02_在研项目/</div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeCreateModal()">取消</button>
      <button class="btn btn-primary" onclick="confirmCreate()">创建项目</button>
    </div>
  </div>
</div>

<!-- ═══ 状态切换器（原型调试） ═══ -->
<div class="state-switcher">
  <button onclick="showState('normal')">正常</button>
  <button onclick="showState('empty')">空</button>
  <button onclick="showState('loading')">加载</button>
  <button onclick="showState('error')">错误</button>
</div>

<script>
// ═══ 模拟数据 ═══
const mockProjects = [
  { project_id: "SW-2026-008", name: "auto-pm（自动化项目管理工具）", stack: "python", version: "0.1.0", phase: "developing", description: "统一CLI管理PLC/Python多技术栈项目的脚手架工具", path: "02_在研项目/SW-2026-008_auto-pm", changes: 3 },
  { project_id: "SW-2026-005", name: "PLC输送线控制系统", stack: "plc", version: "V1.2.0", phase: "production", description: "输送线PLC程序+HMI+变更管理", path: "02_在研项目/SW-2026-005_输送线", changes: 5 },
  { project_id: "DJ-2026-010", name: "数据采集系统", stack: "python", version: "v2.0", phase: "commissioning", description: "MES数据采集与上位机应用", path: "02_在研项目/DJ-2026-010_数据采集", changes: 1 },
  { project_id: "SW-2026-003", name: "SysLib FB标准库", stack: "plc", version: "V3.1", phase: "production", description: "通用功能块库（TONR/FIFO/LIFO等）", path: "01_SysLib/SW-2026-003_FB库", changes: 8 },
  { project_id: "DJ-2026-007", name: "打胶机送料控制", stack: "plc", version: "V1.0", phase: "archived", description: "打胶机送料PLC控制+HMI", path: "03_归档项目/DJ-2026-007_打胶机", changes: 2 },
];

const mockChanges = {
  "SW-2026-008": [
    { change_number: "CHG-SCPT-2026-001", domain: "SCPT", nature: "REQ", status: "implementing", applicant: "fubai", date: "2026-06-15", title: "新增变更管理CLI" },
    { change_number: "CHG-DOC-2026-002", domain: "DOCU", nature: "DEF", status: "draft", applicant: "fubai", date: "2026-06-18", title: "修复PRD文档章节缺失" },
    { change_number: "CHG-SCPT-2026-003", domain: "SCPT", nature: "OPT", status: "completed", applicant: "fubai", date: "2026-06-10", title: "优化Copier模板渲染性能" },
  ],
  "SW-2026-005": [
    { change_number: "CHG-PLC-2026-001", domain: "PLC", nature: "REQ", status: "completed", applicant: "fubai", date: "2026-05-20", title: "新增输送线急停逻辑" },
  ],
};

const mockActivity = {
  "SW-2026-008": [
    "2026-06-19 P4完成 python-tool模板验证通过",
    "2026-06-19 P3完成 变更管理迁移（7模块+19测试）",
    "2026-06-19 P2完成 Click插件架构+Service层迁移",
    "2026-06-19 P1完成 Copier模板PoC验证",
  ],
};

let selectedProject = null;
let currentTab = "overview";

// ═══ 渲染项目列表 ═══
function renderProjectList(projects) {
  const list = document.getElementById("projectList");
  document.getElementById("projectCount").textContent = projects.length;
  document.getElementById("statProjects").textContent = projects.length + " 个项目";

  if (projects.length === 0) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:13px;">无匹配项目</div>';
    return;
  }

  list.innerHTML = projects.map(p => `
    <div class="project-card ${selectedProject === p.project_id ? 'active' : ''}" onclick="selectProject('${p.project_id}')">
      <div class="pid">${p.project_id}</div>
      <div class="pname">${p.name}</div>
      <div class="pmeta">
        <span class="badge badge-${p.stack}">${p.stack}</span>
        <span>${p.version}</span>
        <span class="badge badge-phase">${phaseLabel(p.phase)}</span>
        ${p.changes ? `<span>变更:${p.changes}</span>` : ''}
      </div>
    </div>
  `).join("");
}

function phaseLabel(phase) {
  return { developing: "开发中", commissioning: "调试中", production: "生产中", archived: "已归档" }[phase] || phase;
}

// ═══ 筛选 ═══
function filterProjects() {
  const q = document.getElementById("search").value.toLowerCase();
  const stack = document.getElementById("filterStack").value;
  const phase = document.getElementById("filterPhase").value;
  const filtered = mockProjects.filter(p =>
    (!q || p.project_id.toLowerCase().includes(q) || p.name.toLowerCase().includes(q)) &&
    (!stack || p.stack === stack) &&
    (!phase || p.phase === phase)
  );
  renderProjectList(filtered);
}

// ═══ 选择项目 ═══
function selectProject(pid) {
  selectedProject = pid;
  const p = mockProjects.find(x => x.project_id === pid);
  if (!p) return;

  filterProjects(); // 刷新 active 状态
  document.getElementById("detailTitle").textContent = `${p.project_id}  ${p.name}`;
  document.getElementById("detailSub").textContent = `${p.path}`;
  document.getElementById("tabsBar").style.display = "flex";

  const chgs = mockChanges[pid] || [];
  document.getElementById("chgCount").textContent = chgs.length;

  switchTab("overview");
}

// ═══ 标签页切换 ═══
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach((t, i) => {
    t.classList.toggle("active", ["overview","changes","docs","check"][i] === tab);
  });

  const content = document.getElementById("tabContent");
  const p = mockProjects.find(x => x.project_id === selectedProject);
  if (!p) return;

  if (tab === "overview") {
    const activity = mockActivity[p.project_id] || [];
    const chgs = mockChanges[p.project_id] || [];
    content.innerHTML = `
      <div class="tab-pane active">
        <div class="info-grid">
          <div class="label">项目编号</div><div class="value">${p.project_id}</div>
          <div class="label">名称</div><div class="value">${p.name}</div>
          <div class="label">技术栈</div><div class="value"><span class="badge badge-${p.stack}">${p.stack}</span></div>
          <div class="label">版本</div><div class="value">${p.version}</div>
          <div class="label">阶段</div><div class="value"><span class="badge badge-phase">${phaseLabel(p.phase)}</span> <button class="btn btn-ghost" style="margin-left:8px;padding:2px 10px;font-size:11px;" onclick="alert('编辑阶段')">编辑</button></div>
          <div class="label">路径</div><div class="value" style="font-size:12px;color:var(--text-dim);">${p.path}</div>
          <div class="label">描述</div><div class="value">${p.description}</div>
        </div>
        <div class="section-title">变更概览</div>
        <div style="display:flex;gap:20px;font-size:13px;">
          <span>草稿: ${chgs.filter(c=>c.status==="draft").length}</span>
          <span>实施中: ${chgs.filter(c=>c.status==="implementing").length}</span>
          <span>已完成: ${chgs.filter(c=>c.status==="completed").length}</span>
          <a href="#" onclick="switchTab('changes');return false;" style="color:var(--primary);">查看全部 →</a>
        </div>
        <div class="section-title">最近活动</div>
        ${activity.map(a => `<div class="activity-item"><span class="date">${a.split(" ")[0]}</span>${a.split(" ").slice(1).join(" ")}</div>`).join("")}
      </div>`;
  } else if (tab === "changes") {
    const chgs = mockChanges[p.project_id] || [];
    content.innerHTML = `
      <div class="tab-pane active">
        <div style="margin-bottom:12px;">
          <button class="btn btn-primary" onclick="alert('新建变更单')">+ 新建变更单</button>
          <button class="btn btn-ghost" style="margin-left:8px;">刷新</button>
        </div>
        <table class="chg-table">
          <thead><tr><th>变更编号</th><th>领域</th><th>性质</th><th>状态</th><th>申请人</th><th>日期</th><th>标题</th></tr></thead>
          <tbody>
            ${chgs.map(c => `<tr>
              <td style="color:var(--primary);">${c.change_number}</td>
              <td>${c.domain}</td>
              <td>${c.nature}</td>
              <td><span class="status-tag status-${c.status}">${{draft:"草稿",implementing:"实施中",completed:"已完成"}[c.status]}</span></td>
              <td>${c.applicant}</td>
              <td>${c.date}</td>
              <td>${c.title}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>`;
  } else if (tab === "docs") {
    content.innerHTML = `
      <div class="tab-pane active">
        <div class="section-title">项目文档</div>
        <table class="chg-table">
          <thead><tr><th>文档类型</th><th>文件名</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>REQ</td><td>001_产品需求文档_PRD.md</td><td><span class="status-tag status-completed">存在</span></td><td><a href="#" style="color:var(--primary);">查看</a></td></tr>
            <tr><td>INT</td><td>—</td><td><span class="status-tag status-draft">缺失</span></td><td><a href="#" style="color:var(--primary);">创建</a></td></tr>
            <tr><td>DSN</td><td>—</td><td><span class="status-tag status-draft">缺失</span></td><td><a href="#" style="color:var(--primary);">创建</a></td></tr>
            <tr><td>TEC</td><td>—</td><td><span class="status-tag status-draft">缺失</span></td><td><a href="#" style="color:var(--primary);">创建</a></td></tr>
          </tbody>
        </table>
      </div>`;
  } else if (tab === "check") {
    content.innerHTML = `
      <div class="tab-pane active">
        <div class="section-title">规范检查结果</div>
        <div style="margin-bottom:12px;">
          <button class="btn btn-primary" onclick="alert('运行规范检查')">运行检查</button>
          <button class="btn btn-ghost" style="margin-left:8px;" onclick="alert('自动修复')">自动修复</button>
        </div>
        <table class="chg-table">
          <thead><tr><th>检查项</th><th>规范</th><th>状态</th><th>详情</th></tr></thead>
          <tbody>
            <tr><td>.plc.json</td><td>LSP-907</td><td><span class="status-tag status-completed">PASS</span></td><td>配置文件存在且字段完整</td></tr>
            <tr><td>PM_SESSION</td><td>PM-041</td><td><span class="status-tag status-completed">PASS</span></td><td>会话文件存在</td></tr>
            <tr><td>PRD目录</td><td>LSP-907</td><td><span class="status-tag status-completed">PASS</span></td><td>PRD/ 目录存在</td></tr>
            <tr><td>文档命名</td><td>LSP-907</td><td><span class="status-tag status-implementing">WARN</span></td><td>2个文档命名不规范</td></tr>
          </tbody>
        </table>
      </div>`;
  }
}

// ═══ 新建项目弹窗 ═══
function openCreateModal() { document.getElementById("createModal").classList.add("show"); updatePreview(); }
function closeCreateModal() { document.getElementById("createModal").classList.remove("show"); }
function updateTemplate() {
  const stack = document.querySelector('input[name="stack"]:checked').value;
  const sel = document.getElementById("newTemplate");
  sel.innerHTML = stack === "plc"
    ? '<option>plc-standard</option><option>plc-syslib-fb</option>'
    : '<option>python-tool</option>';
  updatePreview();
}
function updatePreview() {
  const id = document.getElementById("newId").value || "SW-2026-___";
  const name = document.getElementById("newName").value || "新项目";
  document.getElementById("pathPreview").textContent = `预览路径: 02_在研项目/${id}_${name}/`;
}
function confirmCreate() {
  const id = document.getElementById("newId").value;
  const name = document.getElementById("newName").value;
  if (!id || !name) { alert("请填写项目编号和名称"); return; }
  alert(`[原型演示] 将调用 Copier 生成项目:\n  编号: ${id}\n  名称: ${name}\n  模板: ${document.getElementById("newTemplate").value}\n\n实际实现: copier copy → 生成项目骨架 → 扫描入库 → 刷新列表`);
  closeCreateModal();
}

// ═══ 刷新扫描 ═══
function rescan() {
  document.getElementById("scanIndicator").innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span>';
  document.getElementById("statusText").textContent = "扫描中...";
  document.getElementById("statusDot").style.background = "var(--yellow)";
  setTimeout(() => {
    document.getElementById("scanIndicator").innerHTML = "";
    document.getElementById("statusText").textContent = "已同步";
    document.getElementById("statusDot").style.background = "var(--green)";
    document.getElementById("lastScan").textContent = "上次扫描: " + new Date().toLocaleTimeString("zh-CN", {hour:"2-digit",minute:"2-digit"});
    const totalChgs = Object.values(mockChanges).reduce((s, a) => s + a.length, 0);
    document.getElementById("statChanges").textContent = totalChgs + " 个变更单";
  }, 1200);
}

// ═══ 状态切换（原型调试） ═══
function showState(state) {
  const main = document.getElementById("mainArea");
  if (state === "normal") {
    main.style.display = "flex";
    main.innerHTML = document.getElementById("_normalHTML").innerHTML;
    renderProjectList(mockProjects);
    return;
  }
  main.style.display = "flex";
  if (state === "empty") {
    main.innerHTML = `<div class="state-screen" style="flex:1;">
      <div class="state-icon">📁</div>
      <div class="state-title">暂无项目</div>
      <div class="state-desc">工作空间内未发现项目。点击 [+新建] 创建第一个项目，或检查工作空间路径设置 [⚙]</div>
      <button class="btn btn-primary" onclick="openCreateModal()" style="margin-top:8px;">+ 新建项目</button>
    </div>`;
  } else if (state === "loading") {
    main.innerHTML = `<div class="state-screen" style="flex:1;">
      <div class="spinner"></div>
      <div class="state-title">正在扫描工作空间...</div>
      <div class="state-desc">已发现 8 个项目，正在解析元数据</div>
    </div>`;
  } else if (state === "error") {
    main.innerHTML = `<div class="state-screen" style="flex:1;">
      <div class="state-icon">⚠️</div>
      <div class="state-title">扫描失败</div>
      <div class="state-desc">错误: 工作空间路径不存在<br>C:\MyWorkspace\不存在</div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button class="btn btn-primary" onclick="alert('修改工作空间路径')">修改路径</button>
        <button class="btn btn-ghost" onclick="showState('normal')">重试</button>
      </div>
    </div>`;
  }
}

// 保存正常状态 HTML 用于状态切换
document.getElementById("_normalHTML").innerHTML = document.getElementById("mainArea").innerHTML;

// ═══ 初始化 ═══
renderProjectList(mockProjects);
rescan();
</script>

<!-- 隐藏: 正常状态HTML备份 -->
<div id="_normalHTML" style="display:none;"></div>

</body>
</html>
