<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>auto-pm GUI 前端原型（NiceGUI 方案）</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          primary: { 50:'#eef2ff',100:'#e0e7ff',500:'#4a6cf7',600:'#3b5de7',700:'#2c4dd4' },
          plc: '#2563eb', python: '#059669', dj: '#7c3aed', sw: '#0891b2',
          phase: { dev:'#3b82f6', debug:'#f59e0b', prod:'#22c55e', arch:'#94a3b8' }
        },
        fontFamily: {
          sans: ['-apple-system','Microsoft YaHei','Segoe UI','sans-serif'],
          mono: ['JetBrains Mono','Consolas','monospace']
        }
      }
    }
  }
</script>
<style>
  :root { --sidebar-w:240px; --topbar-h:52px; --statusbar-h:28px; }
  html,body { height:100%; }
  body { font-family:-apple-system,"Microsoft YaHei","Segoe UI",sans-serif; }
  [x-cloak]{display:none!important}
  /* 滚动条 */
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#94a3b8}
  .dark ::-webkit-scrollbar-thumb{background:#475569}
  /* 过渡 */
  .nav-item{transition:all .15s}
  .nav-item:hover{transform:translateX(2px)}
  .card-hover{transition:all .2s}
  .card-hover:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(74,108,247,.12)}
  /* 骨架屏 */
  @keyframes shimmer{100%{transform:translateX(100%)}}
  .skeleton{position:relative;overflow:hidden;background:#e2e8f0}
  .skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:shimmer 1.5s infinite}
  .dark .skeleton{background:#334155}
  .dark .skeleton::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent)}
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">

<div x-data="autoPmApp()" x-cloak class="flex flex-col h-screen">

  <!-- ============ 顶部工具栏 ============ -->
  <header class="h-[var(--topbar-h)] bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center px-4 gap-3 flex-shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center text-white font-bold text-sm">AP</div>
      <span class="font-semibold text-sm hidden sm:block">auto-pm</span>
    </div>
    <div class="flex-1 max-w-md">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" placeholder="搜索项目 / 变更单 / 规范..."
               class="w-full h-9 pl-9 pr-3 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 transition">
      </div>
    </div>
    <select x-model="filterBusiness" class="h-9 px-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 hidden md:block">
      <option value="all">全部业务线</option>
      <option value="dj">DJ 单机</option>
      <option value="sw">SW 软件</option>
      <option value="zd">ZD 装置</option>
      <option value="xt">XT 系统</option>
    </select>
    <div class="flex items-center gap-2">
      <div class="relative" x-data="{open:false}">
        <button @click="open=!open" class="h-9 px-3 text-sm rounded-lg bg-primary-500 hover:bg-primary-600 text-white flex items-center gap-1.5 transition">
          <i data-lucide="plus" class="w-4 h-4"></i><span class="hidden sm:inline">新建</span>
          <i data-lucide="chevron-down" class="w-3 h-3"></i>
        </button>
        <div x-show="open" @click.outside="open=false" x-transition
             class="absolute right-0 top-11 w-44 bg-white dark:bg-slate-800 rounded-lg shadow-xl border border-slate-200 dark:border-slate-700 py-1 z-50">
          <button @click="openDialog('newProject','plc');open=false" class="w-full px-3 py-2 text-left text-sm hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2">
            <i data-lucide="cpu" class="w-4 h-4 text-plc"></i>PLC 项目
          </button>
          <button @click="openDialog('newProject','python');open=false" class="w-full px-3 py-2 text-left text-sm hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2">
            <i data-lucide="code-2" class="w-4 h-4 text-python"></i>Python 项目
          </button>
          <div class="my-1 border-t border-slate-200 dark:border-slate-700"></div>
          <button @click="openDialog('createChange');open=false" class="w-full px-3 py-2 text-left text-sm hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2">
            <i data-lucide="file-plus" class="w-4 h-4 text-primary-500"></i>变更单
          </button>
        </div>
      </div>
      <button @click="syncing=true;setTimeout(()=>syncing=false,1500)" :disabled="syncing"
              class="h-9 px-3 text-sm rounded-lg border border-slate-200 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-1.5 disabled:opacity-50 transition">
        <i data-lucide="refresh-cw" class="w-4 h-4" :class="syncing&&'animate-spin'"></i>
        <span class="hidden md:inline" x-text="syncing?'同步中':'同步'"></span>
      </button>
      <button @click="darkMode=!darkMode;document.documentElement.classList.toggle('dark',darkMode)"
              class="h-9 w-9 rounded-lg border border-slate-200 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-center transition">
        <i data-lucide="moon" x-show="!darkMode" class="w-4 h-4"></i>
        <i data-lucide="sun" x-show="darkMode" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- ============ 主区域 ============ -->
  <div class="flex flex-1 overflow-hidden">

    <!-- ============ 侧边栏 ============ -->
    <aside class="w-[var(--sidebar-w)] bg-slate-900 text-slate-300 flex-shrink-0 overflow-y-auto hidden sm:block">
      <div class="py-3">
        <div class="px-4 py-2 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">项目总库</div>
        <button @click="currentPage='projectList';currentFilter={stack:'plc',phase:'all'}"
                class="nav-item w-full flex items-center gap-2 px-4 py-2 text-sm hover:bg-slate-800"
                :class="currentPage==='projectList'&&currentFilter.stack==='plc'?'bg-slate-800 text-white border-l-2 border-primary-500':''">
          <i data-lucide="folder-tree" class="w-4 h-4 text-plc"></i>
          <span class="flex-1 text-left">PLC 总库</span>
          <span class="text-xs bg-slate-700 px-1.5 py-0.5 rounded">6</span>
        </button>
        <button @click="currentPage='projectList';currentFilter={stack:'python',phase:'all'}"
                class="nav-item w-full flex items-center gap-2 px-4 py-2 text-sm hover:bg-slate-800"
                :class="currentPage==='projectList'&&currentFilter.stack==='python'?'bg-slate-800 text-white border-l-2 border-primary-500':''">
          <i data-lucide="folder-tree" class="w-4 h-4 text-python"></i>
          <span class="flex-1 text-left">Python 总库</span>
          <span class="text-xs bg-slate-700 px-1.5 py-0.5 rounded">6</span>
        </button>

        <div class="px-4 py-2 mt-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">全局功能</div>
        <button @click="currentPage='projectList';currentFilter={stack:'all',phase:'all'}"
                class="nav-item w-full flex items-center gap-2 px-4 py-2 text-sm hover:bg-slate-800"
                :class="currentPage==='projectList'&&currentFilter.stack==='all'?'bg-slate-800 text-white border-l-2 border-primary-500':''">
          <i data-lucide="layers" class="w-4 h-4"></i><span class="flex-1 text-left">全部项目</span>
        </button>
        <button @click="currentPage='changeCenter'"
                class="nav-item w-full flex items-center gap-2 px-4 py-2 text-sm hover:bg-slate-800"
                :class="currentPage==='changeCenter'?'bg-slate-800 text-white border-l-2 border-primary-500':''">
          <i data-lucide="git-pull-request" class="w-4 h-4"></i><span class="flex-1 text-left">变更中心</span>
          <span class="text-xs bg-amber-500/20 text-amber-400 px-1.5 py-0.5 rounded">3</span>
        </button>
        <button @click="currentPage='specCenter'"
                class="nav-item w-full flex items-center gap-2 px-4 py-2 text-sm hover:bg-slate-800"
                :class="currentPage==='specCenter'?'bg-slate-800 text-white border-l-2 border-primary-500':''">
          <i data-lucide="book-check" class="w-4 h-4"></i><span class="flex-1 text-left">规范中心</span>
        </button>
        <button @click="currentPage='template'"
                class="nav-item w-full flex items-center gap-2 px-4 py-2 text-sm hover:bg-slate-800"
                :class="currentPage==='template'?'bg-slate-800 text-white border-l-2 border-primary-500':''">
          <i data-lucide="layout-template" class="w-4 h-4"></i><span class="flex-1 text-left">模板管理</span>
        </button>
        <button @click="currentPage='report'"
                class="nav-item w-full flex items-center gap-2 px-4 py-2 text-sm hover:bg-slate-800"
                :class="currentPage==='report'?'bg-slate-800 text-white border-l-2 border-primary-500':''">
          <i data-lucide="bar-chart-3" class="w-4 h-4"></i><span class="flex-1 text-left">报告中心</span>
        </button>

        <div class="px-4 py-2 mt-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">系统</div>
        <button @click="currentPage='settings'"
                class="nav-item w-full flex items-center gap-2 px-4 py-2 text-sm hover:bg-slate-800"
                :class="currentPage==='settings'?'bg-slate-800 text-white border-l-2 border-primary-500':''">
          <i data-lucide="settings" class="w-4 h-4"></i><span class="flex-1 text-left">系统设置</span>
        </button>
        <button @click="currentPage='about'"
                class="nav-item w-full flex items-center gap-2 px-4 py-2 text-sm hover:bg-slate-800"
                :class="currentPage==='about'?'bg-slate-800 text-white border-l-2 border-primary-500':''">
          <i data-lucide="info" class="w-4 h-4"></i><span class="flex-1 text-left">关于</span>
        </button>
      </div>
    </aside>

    <!-- ============ 内容区 ============ -->
    <main class="flex-1 overflow-y-auto">

      <!-- ====== 页面：项目列表 ====== -->
      <div x-show="currentPage==='projectList'" class="p-6">

        <!-- 状态覆盖：加载中（骨架屏） -->
        <template x-if="loading">
          <div class="space-y-4">
            <div class="h-8 w-48 skeleton rounded"></div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
              <template x-for="i in 8" :key="i">
                <div class="bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700">
                  <div class="flex items-center gap-2 mb-3">
                    <div class="w-6 h-6 skeleton rounded"></div>
                    <div class="h-4 w-16 skeleton rounded"></div>
                  </div>
                  <div class="h-5 w-3/4 skeleton rounded mb-2"></div>
                  <div class="h-3 w-1/2 skeleton rounded mb-3"></div>
                  <div class="h-6 w-24 skeleton rounded"></div>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- 状态覆盖：空状态 -->
        <template x-if="!loading && filteredProjects.length===0">
          <div class="flex flex-col items-center justify-center py-20 text-center">
            <div class="w-20 h-20 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center mb-4">
              <i data-lucide="folder-open" class="w-10 h-10 text-slate-400"></i>
            </div>
            <h3 class="text-lg font-semibold mb-2">暂无项目</h3>
            <p class="text-sm text-slate-500 mb-4">当前筛选条件下没有项目，试试调整筛选或新建项目</p>
            <button @click="openDialog('newProject','plc')" class="px-4 py-2 bg-primary-500 hover:bg-primary-600 text-white rounded-lg text-sm flex items-center gap-1.5 transition">
              <i data-lucide="plus" class="w-4 h-4"></i>新建项目
            </button>
          </div>
        </template>

        <!-- 正常状态：项目列表 -->
        <template x-if="!loading && filteredProjects.length>0">
          <div>
            <!-- 视图切换 + 排序 -->
            <div class="flex items-center justify-between mb-5 flex-wrap gap-3">
              <div class="flex items-center gap-3">
                <h2 class="text-lg font-semibold" x-text="pageTitle"></h2>
                <span class="text-sm text-slate-500" x-text="'共 '+filteredProjects.length+' 个项目'"></span>
              </div>
              <div class="flex items-center gap-2">
                <div class="flex bg-slate-100 dark:bg-slate-800 rounded-lg p-0.5">
                  <button @click="viewMode='card'" :class="viewMode==='card'?'bg-white dark:bg-slate-700 shadow-sm':''"
                          class="px-2.5 py-1 rounded-md text-xs flex items-center gap-1 transition">
                    <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>卡片
                  </button>
                  <button @click="viewMode='list'" :class="viewMode==='list'?'bg-white dark:bg-slate-700 shadow-sm':''"
                          class="px-2.5 py-1 rounded-md text-xs flex items-center gap-1 transition">
                    <i data-lucide="list" class="w-3.5 h-3.5"></i>列表
                  </button>
                </div>
                <select x-model="sortBy" class="h-8 px-2 text-xs rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700">
                  <option value="id">编号</option>
                  <option value="phase">阶段</option>
                  <option value="updated">修改时间</option>
                  <option value="changes">变更数</option>
                </select>
              </div>
            </div>

            <!-- 卡片视图 -->
            <div x-show="viewMode==='card'" class="space-y-6">
              <template x-for="group in groupedProjects" :key="group.key">
                <div>
                  <div class="flex items-center gap-2 mb-3">
                    <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
                    <h3 class="font-medium text-sm" x-text="group.title"></h3>
                    <span class="text-xs text-slate-400" x-text="group.projects.length+' 个'"></span>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    <template x-for="p in group.projects" :key="p.id">
                      <div @click="enterProject(p)"
                           class="card-hover bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700 cursor-pointer">
                        <div class="flex items-center justify-between mb-3">
                          <div class="flex items-center gap-2">
                            <span class="px-1.5 py-0.5 rounded text-[10px] font-bold uppercase"
                                  :class="p.stack==='plc'?'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300':'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300'"
                                  x-text="p.stack"></span>
                            <span class="text-xs text-slate-500" x-text="p.business"></span>
                            <span class="text-xs text-slate-400" x-text="'v'+p.version"></span>
                          </div>
                          <button @click.stop="" class="text-slate-400 hover:text-slate-600">
                            <i data-lucide="more-vertical" class="w-4 h-4"></i>
                          </button>
                        </div>
                        <h4 class="font-semibold text-sm mb-1 line-clamp-1" x-text="p.name"></h4>
                        <p class="text-xs text-slate-500 mb-3 font-mono" x-text="p.id"></p>
                        <div class="flex items-center justify-between">
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-medium"
                                :class="phaseClass(p.phase)"
                                x-text="phaseLabel(p.phase)"></span>
                          <div class="flex items-center gap-3 text-xs text-slate-400">
                            <span class="flex items-center gap-1"><i data-lucide="git-pull-request" class="w-3 h-3"></i><span x-text="p.changes"></span></span>
                            <span x-text="p.updated"></span>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>

            <!-- 列表视图 -->
            <div x-show="viewMode==='list'" class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
              <table class="w-full text-sm">
                <thead class="bg-slate-50 dark:bg-slate-900/50 text-xs text-slate-500 uppercase">
                  <tr>
                    <th class="px-4 py-3 text-left font-medium">编号</th>
                    <th class="px-4 py-3 text-left font-medium">业务线</th>
                    <th class="px-4 py-3 text-left font-medium">项目名称</th>
                    <th class="px-4 py-3 text-left font-medium">技术栈</th>
                    <th class="px-4 py-3 text-left font-medium">阶段</th>
                    <th class="px-4 py-3 text-left font-medium">版本</th>
                    <th class="px-4 py-3 text-right font-medium">变更数</th>
                    <th class="px-4 py-3 text-left font-medium">修改时间</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-700">
                  <template x-for="p in filteredProjects" :key="p.id">
                    <tr @click="enterProject(p)" class="hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer transition">
                      <td class="px-4 py-3 font-mono text-xs" x-text="p.id"></td>
                      <td class="px-4 py-3" x-text="p.business"></td>
                      <td class="px-4 py-3 font-medium" x-text="p.name"></td>
                      <td class="px-4 py-3"><span class="px-1.5 py-0.5 rounded text-[10px] font-bold uppercase"
                            :class="p.stack==='plc'?'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300':'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300'"
                            x-text="p.stack"></span></td>
                      <td class="px-4 py-3"><span class="px-2 py-0.5 rounded-full text-[10px] font-medium"
                            :class="phaseClass(p.phase)" x-text="phaseLabel(p.phase)"></span></td>
                      <td class="px-4 py-3 text-slate-500" x-text="'v'+p.version"></td>
                      <td class="px-4 py-3 text-right" x-text="p.changes"></td>
                      <td class="px-4 py-3 text-slate-500 text-xs" x-text="p.updated"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>
      </div>

      <!-- ====== 页面：项目工作区 ====== -->
      <div x-show="currentPage==='workspace'" class="p-6">
        <template x-if="currentProject">
          <div>
            <!-- 工作区 Header -->
            <div class="mb-5">
              <button @click="currentPage='projectList'" class="text-sm text-slate-500 hover:text-primary-500 flex items-center gap-1 mb-3">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>返回项目列表
              </button>
              <div class="flex items-start justify-between flex-wrap gap-3">
                <div>
                  <div class="flex items-center gap-2 mb-1">
                    <span class="px-2 py-0.5 rounded text-xs font-bold uppercase"
                          :class="currentProject.stack==='plc'?'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300':'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300'"
                          x-text="currentProject.stack"></span>
                    <span class="px-2 py-0.5 rounded-full text-xs font-medium"
                          :class="phaseClass(currentProject.phase)"
                          x-text="phaseLabel(currentProject.phase)"></span>
                  </div>
                  <h2 class="text-xl font-semibold" x-text="currentProject.name"></h2>
                  <p class="text-sm text-slate-500 font-mono" x-text="currentProject.id"></p>
                </div>
                <div class="flex items-center gap-2">
                  <button @click="openDialog('editProject')" class="h-9 px-3 text-sm rounded-lg border border-slate-200 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-1.5 transition">
                    <i data-lucide="pencil" class="w-4 h-4"></i>编辑
                  </button>
                  <button @click="openDialog('createChange')" class="h-9 px-3 text-sm rounded-lg bg-primary-500 hover:bg-primary-600 text-white flex items-center gap-1.5 transition">
                    <i data-lucide="file-plus" class="w-4 h-4"></i>创建变更单
                  </button>
                </div>
              </div>
            </div>

            <!-- Tab 栏 -->
            <div class="border-b border-slate-200 dark:border-slate-700 mb-5">
              <div class="flex gap-1 overflow-x-auto">
                <button @click="workspaceTab='overview'" :class="workspaceTab==='overview'?'border-primary-500 text-primary-500':'border-transparent text-slate-500 hover:text-slate-700'"
                        class="px-4 py-2.5 text-sm font-medium border-b-2 transition flex items-center gap-1.5">
                  <i data-lucide="info" class="w-4 h-4"></i>概览
                </button>
                <button @click="workspaceTab='change'" :class="workspaceTab==='change'?'border-primary-500 text-primary-500':'border-transparent text-slate-500 hover:text-slate-700'"
                        class="px-4 py-2.5 text-sm font-medium border-b-2 transition flex items-center gap-1.5">
                  <i data-lucide="git-pull-request" class="w-4 h-4"></i>变更
                  <span class="text-xs bg-slate-100 dark:bg-slate-700 px-1.5 rounded" x-text="currentProject.changes"></span>
                </button>
                <button @click="workspaceTab='check'" :class="workspaceTab==='check'?'border-primary-500 text-primary-500':'border-transparent text-slate-500 hover:text-slate-700'"

    get filteredProjects() {
      let list = this.projects.filter(p => {
        if (this.currentFilter.stack !== 'all' && p.stack !== this.currentFilter.stack) return false;
        if (this.currentFilter.phase !== 'all' && p.phase !== this.currentFilter.phase) return false;
        if (this.filterBusiness !== 'all' && p.business.toLowerCase().includes(this.filterBusiness) === false) return false;
        return true;
      });
      // 排序
      const sorters = {
        id: (a,b) => a.id.localeCompare(b.id),
        phase: (a,b) => a.phase.localeCompare(b.phase),
        updated: (a,b) => b.updated.localeCompare(a.updated),
        changes: (a,b) => b.changes - a.changes
      };
      return list.sort(sorters[this.sortBy] || sorters.id);
    },
    get groupedProjects() {
      const groups = {};
      this.filteredProjects.forEach(p => {
        const key = p.stack;
        if (!groups[key]) groups[key] = { key, title: p.stack==='plc'?'PLC 总库':'Python 总库', projects: [] };
        groups[key].projects.push(p);
      });
      return Object.values(groups);
    },

      completed:'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300',
      closed:'bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-400'

      { id:'DJ-2026-018', name:'检测机项目', stack:'plc', business:'DJ 单机', phase:'arch', version:'1.5', changes:0, updated:'05-30' },
      { id:'SW-2026-001', name:'变量表解析工具', stack:'python', business:'SW 软件', phase:'prod', version:'1.2', changes:0, updated:'05-20' },
      { id:'SW-2026-004', name:'项目管理系统', stack:'python', business:'SW 软件', phase:'prod', version:'2.0', changes:2, updated:'06-10' },
      { id:'SW-2026-008', name:'auto-pm 项目管理工具', stack:'python', business:'SW 软件', phase:'dev', version:'0.5.4', changes:3, updated:'07-03' },
      { id:'SW-2026-010', name:'报告生成器', stack:'python', business:'SW 软件', phase:'debug', version:'0.8', changes:1, updated:'06-28' },
