<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>auto-pm | 全功能高保真原型</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- ==========================================
         ============= 1. 核心样式体系 ============= 
         ========================================== -->
    <style>
        :root {
            --bg-base: #020617;
            --bg-gradient-1: #1e1b4b;
            --bg-gradient-2: #0f172a;
            --primary: #6366f1; 
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #38bdf8; 
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-bg-hover: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --sidebar-width: 260px;
            --header-height: 72px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', "Microsoft YaHei", sans-serif; background-color: var(--bg-base); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; position: relative; }
        .ambient-orb { position: absolute; border-radius: 50%; filter: blur(120px); z-index: 0; opacity: 0.5; animation: float 20s infinite ease-in-out alternate; pointer-events: none; }
        .orb-1 { top: -10%; left: -5%; width: 50vw; height: 50vw; background: radial-gradient(circle, var(--primary) 0%, transparent 70%); }
        .orb-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, var(--secondary) 0%, transparent 70%); animation-delay: -10s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(5%, 5%) scale(1.1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); border-radius: var(--radius-lg); }
        .btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: var(--radius-md); font-weight: 500; cursor: pointer; transition: var(--transition-smooth); display: inline-flex; align-items: center; gap: 8px; font-family: inherit; }
        .btn:hover { background: #4f46e5; box-shadow: 0 4px 12px var(--primary-glow); transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid var(--glass-border); }
        .btn-outline:hover { background: var(--glass-bg-hover); box-shadow: none; }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
        
        .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; background: rgba(255,255,255,0.1); }
        .tag.error { background: rgba(239,68,68,0.2); color: var(--danger); border: 1px solid var(--danger); }
        .tag.warn { background: rgba(245,158,11,0.2); color: var(--warning); border: 1px solid var(--warning); }
        .tag.success { background: rgba(16,185,129,0.2); color: var(--success); border: 1px solid var(--success); }

        .sidebar { width: var(--sidebar-width); height: 100vh; padding: 24px; display: flex; flex-direction: column; gap: 32px; border-right: 1px solid var(--glass-border); background: rgba(2, 6, 23, 0.4); backdrop-filter: blur(20px); z-index: 20; }
        .logo-area { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 8px; display: flex; align-items: center; justify-content: center; -webkit-text-fill-color: white; }
        .nav-menu { display: flex; flex-direction: column; gap: 8px; list-style: none; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); color: var(--text-muted); text-decoration: none; font-weight: 500; transition: var(--transition-smooth); cursor: pointer; }
        .nav-item:hover { background: var(--glass-bg-hover); color: var(--text-main); transform: translateX(4px); }
        .nav-item.active { background: linear-gradient(90deg, rgba(99,102,241,0.15) 0%, transparent 100%); color: var(--text-main); border-left: 3px solid var(--primary); }
        .nav-item.active i { color: var(--primary); text-shadow: 0 0 12px var(--primary-glow); }

        .main-content { flex: 1; height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 10; }
        .header { height: var(--header-height); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; border-bottom: 1px solid var(--glass-border); background: rgba(2, 6, 23, 0.2); backdrop-filter: blur(10px); }
        .router-view { flex: 1; overflow-y: auto; padding: 32px 40px; display: flex; flex-direction: column; gap: 32px; animation: fadeIn 0.4s ease-out; }
        .router-view::-webkit-scrollbar { width: 6px; }
        .router-view::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

        .search-bar { display: flex; align-items: center; gap: 8px; background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 8px 16px; border-radius: 20px; width: 300px; transition: var(--transition-smooth); }
        .search-bar:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); background: rgba(255,255,255,0.06); }
        .search-bar input { background: transparent; border: none; color: var(--text-main); outline: none; width: 100%; font-family: inherit; }

        /* Dashboard 组件 */
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
        .kpi-card { padding: 24px; display: flex; flex-direction: column; gap: 16px; transition: var(--transition-smooth); }
        .kpi-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.15); box-shadow: 0 12px 40px 0 rgba(0,0,0,0.4); }
        .kpi-value { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
        .dashboard-main { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; height: 500px; }
        
        .state-machine { padding: 40px; display: flex; align-items: center; justify-content: space-between; position: relative; height: calc(100% - 65px); }
        .sm-line { position: absolute; top: 50%; left: 40px; right: 40px; height: 2px; background: var(--glass-border); z-index: 1; transform: translateY(-50%); }
        .sm-line-active { position: absolute; top: 50%; left: 40px; width: 0%; height: 2px; background: var(--primary); z-index: 2; transform: translateY(-50%); box-shadow: 0 0 10px var(--primary); transition: width 0.8s ease-out; }
        .sm-node { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer; transition: var(--transition-smooth); }
        .sm-node:hover { transform: translateY(-5px); }
        .sm-circle { width: 48px; height: 48px; border-radius: 50%; background: var(--bg-gradient-2); border: 2px solid var(--glass-border); display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-muted); transition: var(--transition-smooth); }
        .sm-node.done .sm-circle { background: rgba(16, 185, 129, 0.1); border-color: var(--success); color: var(--success); }
        .sm-node.active .sm-circle { background: rgba(99, 102, 241, 0.1); border-color: var(--primary); color: var(--primary); box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(99, 102, 241, 0); } 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); } }

        /* 通用 Table */
        .data-table { width: 100%; border-collapse: collapse; text-align: left; }
        .data-table th { padding: 16px; border-bottom: 1px solid var(--glass-border); color: var(--text-muted); font-weight: 500; font-size: 14px; }
        .data-table td { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.02); transition: background 0.2s; }
        .data-table tr:hover td { background: rgba(255,255,255,0.03); cursor: pointer; }

        /* 模态框 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: var(--transition-smooth); }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { width: 480px; transform: translateY(20px); transition: var(--transition-smooth); padding: 32px; }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        /* 布局卡片网格 (用于模板管理等) */
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .card-file { padding: 20px; display: flex; flex-direction: column; gap: 12px; transition: var(--transition-smooth); cursor: pointer; }
        .card-file:hover { transform: translateY(-4px); border-color: var(--primary); background: rgba(255,255,255,0.05); }

    </style>
</head>
<body>

    <!-- 氛围光晕 -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <!-- ==========================================
         ============= 2. 核心骨架 (Shell) ============= 
         ========================================== -->
    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo-icon"><i class="ph-bold ph-hexagon"></i></div>
            auto-pm
        </div>
        <nav>
            <div style="font-size:12px; color:var(--text-muted); margin-bottom:8px; padding-left:4px; font-weight:600;">工程管线</div>
            <ul class="nav-menu" id="nav-list">
                <li class="nav-item" data-route="projects"><i class="ph ph-squares-four"></i> 项目大厅</li>
                <li class="nav-item active" data-route="dashboard"><i class="ph ph-folder-open"></i> 项目工作台</li>
                <li class="nav-item" data-route="changes"><i class="ph ph-arrows-left-right"></i> 变更中心</li>
            </ul>
            
            <div style="font-size:12px; color:var(--text-muted); margin:24px 0 8px 0; padding-left:4px; font-weight:600;">质量保障</div>
            <ul class="nav-menu">
                <li class="nav-item" data-route="specs"><i class="ph ph-shield-check"></i> 规范检查 (LSP)</li>
                <li class="nav-item" data-route="templates"><i class="ph ph-files"></i> 模板与交付</li>
            </ul>
        </nav>

        <div style="margin-top: auto;">
            <ul class="nav-menu">
                <li class="nav-item" data-route="settings"><i class="ph ph-gear"></i> 系统设置</li>
            </ul>
        </div>
    </aside>

    <main class="main-content">
        <header class="header">
            <div class="search-bar">
                <i class="ph ph-magnifying-glass" style="color: var(--text-muted)"></i>
                <input type="text" placeholder="搜索项目、变更单号、规范条目...">
            </div>
            <div class="user-actions" style="display:flex; gap:16px; align-items:center;">
                <button class="btn btn-outline" onclick="app.showModal('新建流', '功能开发中。')"><i class="ph ph-plus"></i> 新建</button>
                <div style="width: 36px; height:36px; border-radius:50%; background: linear-gradient(135deg, #a855f7, #3b82f6); border: 2px solid var(--glass-border);"></div>
            </div>
        </header>

        <!-- 动态路由渲染挂载点 -->
        <div id="app-view" class="router-view"></div>
    </main>

    <!-- 全局弹窗层 -->
    <div id="sys-modal" class="modal-overlay" onclick="app.closeModal(event)">
        <div class="glass-panel modal-content" onclick="event.stopPropagation()">
            <h2 id="modal-title" style="margin-bottom:16px;">提示</h2>
            <p id="modal-body" style="color:var(--text-muted); line-height:1.6; margin-bottom: 24px;"></p>
            <div style="text-align: right;">
                <button class="btn" onclick="app.closeModal()">确认</button>
            </div>
        </div>
    </div>

    <!-- ==========================================
         ============= 3. 视图模板 (Views) ============= 
         ========================================== -->
         
    <!-- [模块 1]: 项目大厅视图 -->
    <template id="view-projects">
        <div class="page-header">
            <h1 style="font-size:28px; margin-bottom:8px;">所有项目</h1>
            <p style="color:var(--text-muted);">查看并管理工作区中的所有工程。</p>
        </div>
        <div class="glass-panel" style="padding: 24px;">
            <table class="data-table">
                <thead><tr><th>项目编号</th><th>项目名称</th><th>状态</th><th>负责人</th><th>最后更新</th></tr></thead>
                <tbody id="projects-tbody"></tbody>
            </table>
        </div>
    </template>

    <!-- [模块 2]: Dashboard 视图 (主工作台) -->
    <template id="view-dashboard">
        <div class="page-header">
            <h1 style="font-size:28px; margin-bottom:8px;">SW-2026-008_auto-pm_自动化项目管理工具</h1>
            <p style="color:var(--text-muted);">Python自动化项目总库 / 02_在研项目 / 状态: 运行中 (Phase: developing)</p>
        </div>
        <div class="kpi-grid">
            <div class="glass-panel kpi-card">
                <div style="display:flex; justify-content:space-between; color:var(--text-muted);">活跃变更单 <i class="ph-fill ph-git-merge" style="color:#6366f1; font-size:24px;"></i></div>
                <div class="kpi-value">12</div>
                <div style="font-size:12px; color:var(--success);"><i class="ph-bold ph-trend-up"></i> 较上周新增 3 单</div>
            </div>
            <div class="glass-panel kpi-card">
                <div style="display:flex; justify-content:space-between; color:var(--text-muted);">PLC 规范检查 <i class="ph-fill ph-shield-check" style="color:#10b981; font-size:24px;"></i></div>
                <div class="kpi-value" id="kpi-spec">95%</div>
                <div style="font-size:12px; color:var(--warning);"><i class="ph-bold ph-warning"></i> 2 个违规项待修复</div>
            </div>
            <div class="glass-panel kpi-card">
                <div style="display:flex; justify-content:space-between; color:var(--text-muted);">技术债 <i class="ph-fill ph-warning" style="color:#f59e0b; font-size:24px;"></i></div>
                <div class="kpi-value">0</div>
                <div style="font-size:12px; color:var(--success);"><i class="ph-bold ph-trend-down"></i> 全部偿还</div>
            </div>
        </div>

        <div class="dashboard-main">
            <div class="glass-panel">
                <div style="padding:20px; border-bottom:1px solid var(--glass-border); font-weight:600; display:flex; justify-content:space-between;">
                    变更单流转 (CHG-SCPT-2026-101) <span style="font-size:12px; font-weight:normal; color:var(--text-muted);">点击下划线节点模拟流转</span>
                </div>
                <div class="state-machine">
                    <div class="sm-line"></div>
                    <div class="sm-line-active" id="sm-progress" style="width: 50%;"></div>
                    <div class="sm-node done"><div class="sm-circle"><i class="ph-bold ph-pencil-simple"></i></div><div style="font-size:12px; margin-top:8px;">草稿</div></div>
                    <div class="sm-node done"><div class="sm-circle"><i class="ph-bold ph-paper-plane-tilt"></i></div><div style="font-size:12px; margin-top:8px;">已提交</div></div>
                    <div class="sm-node done"><div class="sm-circle"><i class="ph-bold ph-magnifying-glass"></i></div><div style="font-size:12px; margin-top:8px;">审核中</div></div>
                    <div class="sm-node active" id="node-implementing" onclick="app.simulateStateChange()">
                        <div class="sm-circle"><i class="ph-bold ph-code"></i></div>
                        <div style="font-size:12px; margin-top:8px; color:var(--primary); font-weight:bold; cursor:pointer; text-decoration:underline;">实施中 👈</div>
                    </div>
                    <div class="sm-node" id="node-completed"><div class="sm-circle"><i class="ph-bold ph-check"></i></div><div style="font-size:12px; margin-top:8px;">已完成</div></div>
                </div>
            </div>
            <div class="glass-panel" style="padding:24px; overflow-y:auto;" id="timeline-container"></div>
        </div>
    </template>

    <!-- [模块 3]: 变更中心 (左右分屏) -->
    <template id="view-changes">
        <div class="page-header">
            <h1 style="font-size:28px; margin-bottom:8px;">变更中心 (Change Center)</h1>
            <p style="color:var(--text-muted);">跨项目的全局变更单审批与流转记录。</p>
        </div>
        <div style="display:flex; gap:24px; height:100%;">
            <!-- 列表区 -->
            <div class="glass-panel" style="flex:1; padding:16px; overflow-y:auto;">
                <div style="margin-bottom:16px; display:flex; gap:8px;">
                    <button class="btn btn-outline" style="background:var(--glass-bg-hover)">所有变更单 (12)</button>
                    <button class="btn btn-outline">待我审批 (2)</button>
                </div>
                <table class="data-table">
                    <tbody id="changes-tbody"></tbody>
                </table>
            </div>
            <!-- 详情预览区 -->
            <div class="glass-panel" style="flex:1; padding:32px; display:flex; flex-direction:column; gap:24px;" id="change-detail-view">
                <div style="color:var(--text-muted); text-align:center; margin-top:80px;">请在左侧选择一个变更单查看详情</div>
            </div>
        </div>
    </template>

    <!-- [模块 4]: 规范检查 (LSP Center) -->
    <template id="view-specs">
        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px;">
            <div class="page-header" style="margin-bottom:0;">
                <h1 style="font-size:28px; margin-bottom:8px;">PLC 代码与工程规范检查 (LSP)</h1>
                <p style="color:var(--text-muted);">当前引擎: Siemens TIA Portal v18 / Rule-Set: 2026-Auto-Standard</p>
            </div>
            <button class="btn" onclick="app.runSpecScan()" id="btn-scan"><i class="ph-bold ph-play"></i> 运行全量检查</button>
        </div>
        
        <div class="glass-panel" style="padding:24px; margin-bottom:24px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                <span style="font-weight:600;">代码健康度扫描进度</span>
                <span id="scan-pct">100% (2 项违规)</span>
            </div>
            <div style="width:100%; height:8px; background:var(--glass-border); border-radius:4px; overflow:hidden;">
                <div id="scan-bar" style="width:100%; height:100%; background:var(--warning); transition:width 0.5s;"></div>
            </div>
        </div>

        <div class="glass-panel" style="padding:24px;">
            <h3 style="margin-bottom:16px; font-size:16px; border-bottom:1px solid var(--glass-border); padding-bottom:12px;">检查结果列表</h3>
            <table class="data-table">
                <thead><tr><th>规则编号</th><th>规则描述</th><th>位置</th><th>状态</th><th>操作</th></tr></thead>
                <tbody id="specs-tbody"></tbody>
            </table>
        </div>
    </template>

    <!-- [模块 5]: 模板与交付 (Templates) -->
    <template id="view-templates">
        <div class="page-header">
            <h1 style="font-size:28px; margin-bottom:8px;">模板与交付管理</h1>
            <p style="color:var(--text-muted);">使用标准模板一键生成工程交付物。</p>
        </div>
        <div class="grid-cards" id="templates-grid"></div>
    </template>

    <!-- [模块 6]: 系统设置 (Settings) -->
    <template id="view-settings">
        <div class="page-header">
            <h1 style="font-size:28px; margin-bottom:8px;">系统与工作区设置</h1>
            <p style="color:var(--text-muted);">管理本地环境、数据库与缓存配置。</p>
        </div>
        <div style="display:flex; flex-direction:column; gap:24px; max-width:800px;">
            <div class="glass-panel" style="padding:32px;">
                <h3 style="margin-bottom:24px; font-size:16px;"><i class="ph-bold ph-folder"></i> 基础配置</h3>
                <div style="display:flex; flex-direction:column; gap:16px;">
                    <div>
                        <label style="display:block; margin-bottom:8px; color:var(--text-muted); font-size:14px;">全局工作空间根目录 (Workspace Root)</label>
                        <input type="text" value="c:\Users\fubai\Desktop\My_Workspace" class="search-bar" style="width:100%; border-radius:8px;">
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:8px; color:var(--text-muted); font-size:14px;">扫描层级深度限制</label>
                        <input type="number" value="4" class="search-bar" style="width:150px; border-radius:8px;">
                    </div>
                </div>
            </div>
            
            <div class="glass-panel" style="padding:32px; border-color:rgba(239, 68, 68, 0.3);">
                <h3 style="margin-bottom:24px; font-size:16px; color:var(--danger);"><i class="ph-bold ph-warning-circle"></i> 危险操作 (Danger Zone)</h3>
                <div style="display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,0.05); padding-bottom:16px;">
                    <div>
                        <div style="font-weight:500;">重建项目索引数据库</div>
                        <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">强制重新扫描工作区，丢弃未保存的临时状态。</div>
                    </div>
                    <button class="btn btn-outline" onclick="app.showModal('重建索引', '索引数据库重建已在后台开始执行...')">重建索引</button>
                </div>
                <div style="display:flex; align-items:center; justify-content:space-between; margin-top:16px;">
                    <div>
                        <div style="font-weight:500;">清除所有本地缓存</div>
                        <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">清除 QML Bridge 缓存和缩略图，释放磁盘空间。</div>
                    </div>
                    <button class="btn btn-danger" onclick="app.showModal('警告', '所有缓存已被清除，系统需要重启生效。')">清除缓存</button>
                </div>
            </div>
        </div>
    </template>


    <!-- ==========================================
         ============= 4. 业务逻辑 (App JS) ============ 
         ========================================== -->
    <script>
        /**
         * [MOCK DATA] 结构化模拟数据库
         */
        const Database = {
            projects: [
                { id: "SW-2026-008", name: "auto-pm_自动化项目管理工具", status: "Phase: developing", owner: "fubai", date: "2026-07-08" },
                { id: "SW-2025-102", name: "PLC_标准化功能块库", status: "Phase: production", owner: "fubai", date: "2026-06-15" },
                { id: "HW-2026-001", name: "三轴伺服控制台搭建", status: "Phase: commissioning", owner: "john", date: "2026-07-01" }
            ],
            timeline: [
                { type: 'success', title: '状态变更: 审核中 -> 实施中', desc: '审批人 fubai 同意方案。', time: '今天 10:45 AM' },
                { type: 'warning', title: '资料请求', desc: '要求补充测试报告。', time: '昨天 16:30 PM' },
                { type: 'success', title: '创建变更单', desc: 'CHG-101 创建成功。', time: '2026-07-06 14:00 PM' }
            ],
            changes: [
                { id: "CHG-SCPT-2026-101", title: "QML架构最终重构与性能优化", author: "fubai", status: "实施中", tag: "primary" },
                { id: "CHG-PLC-2026-045", title: "S7-1500 报警块接口扩容", author: "fubai", status: "待审批", tag: "warning" },
                { id: "CHG-DOC-2026-012", title: "更新V0.9.2用户操作手册", author: "john", status: "已完成", tag: "success" }
            ],
            specs: [
                { rule: "LSP-SCL-001", desc: "FB 功能块内部变量 (Static) 必须使用静态前缀 'stat_'", loc: "MotorControl_FB.scl : 行 24", status: "error" },
                { rule: "LSP-DB-015", desc: "全局数据块 (Global DB) 取消勾选优化块访问 (Optimized Block Access)", loc: "HMI_Data.db : 属性", status: "error" },
                { rule: "LSP-DOC-003", desc: "PM_SESSION.md 必须包含 [技术债] 章节", loc: "PM_SESSION_SW-2026-008.md", status: "pass" },
                { rule: "LSP-VAR-009", desc: "临时变量禁止未赋初值直接在右侧 (Right-hand) 读取", loc: "Main_OB1.scl", status: "pass" }
            ],
            templates: [
                { id: "REQ-01", name: "标准需求规格说明书 (REQ)", icon: "ph-file-text", type: "Markdown", desc: "包含功能列表与非功能性约束的标准项目启动文档。" },
                { id: "DES-02", name: "系统详细设计 (DES)", icon: "ph-file-pdf", type: "Word/PDF", desc: "涵盖软硬件架构、通讯拓扑与接口定义的设计模板。" },
                { id: "PLC-FB", name: "西门子 SCL FB 骨架", icon: "ph-file-code", type: "TIA Portal", desc: "自带标准报警、使能、错误处理状态机接口的 SCL 源码。" },
                { id: "PM-SES", name: "PM_SESSION 真源文档", icon: "ph-file-md", type: "Markdown", desc: "自动管理工具所依赖的标准化核心状态跟踪文档。" }
            ]
        };

        /**
         * [CONTROLLER] 应用核心控制器 (MVC)
         */
        class Application {
            constructor() {
                this.viewContainer = document.getElementById('app-view');
                this.modal = document.getElementById('sys-modal');
                this.navItems = document.querySelectorAll('.nav-item');
                this.bindEvents();
                this.navigate('dashboard'); // 默认展示看板
            }

            // --- 路由与导航 ---
            bindEvents() {
                this.navItems.forEach(item => {
                    item.addEventListener('click', (e) => {
                        this.navItems.forEach(n => n.classList.remove('active'));
                        e.currentTarget.classList.add('active');
                        this.navigate(e.currentTarget.dataset.route);
                    });
                });
            }

            navigate(route) {
                this.viewContainer.innerHTML = '';
                const template = document.getElementById(`view-${route}`);
                if (template) {
                    this.viewContainer.appendChild(template.content.cloneNode(true));
                    // 派发到具体的 Controller Init 方法
                    if (this[`init_${route}`]) this[`init_${route}`]();
                } else {
                    this.viewContainer.innerHTML = `<h2 style="color:var(--text-muted)">功能开发中...</h2>`;
                }
            }

            // --- [1] 项目大厅逻辑 ---
            init_projects() {
                const tbody = document.getElementById('projects-tbody');
                let html = '';
                Database.projects.forEach(p => {
                    const statusColor = p.status.includes('production') ? 'var(--success)' : (p.status.includes('developing') ? 'var(--primary)' : 'var(--warning)');
                    html += `
                        <tr onclick="app.navigate('dashboard'); document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); document.querySelector('[data-route=dashboard]').classList.add('active');">
                            <td style="font-family:monospace; color:var(--primary); font-weight:600;">${p.id}</td>
                            <td style="font-weight:500;">${p.name}</td>
                            <td><span class="tag" style="color:${statusColor}; border:1px solid ${statusColor}">${p.status}</span></td>
                            <td>${p.owner}</td>
                            <td>${p.date}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            }

            // --- [2] 驾驶舱逻辑 ---
            init_dashboard() { this.renderTimeline(); }
            
            renderTimeline() {
                const container = document.getElementById('timeline-container');
                if(!container) return;
                let html = '<h3 style="margin-bottom:16px; font-size:16px;">活动时间线</h3><div style="display:flex; flex-direction:column; gap:24px; position:relative;">';
                Database.timeline.forEach((item, index) => {
                    const colorMap = { success: 'var(--success)', warning: 'var(--warning)', default: 'var(--primary)' };
                    const color = colorMap[item.type] || colorMap.default;
                    html += `
                        <div style="display:flex; gap:16px; position:relative;">
                            ${index !== Database.timeline.length - 1 ? '<div style="position:absolute; left:5px; top:24px; bottom:-24px; width:1px; background:var(--glass-border);"></div>' : ''}
                            <div style="width:11px; height:11px; border-radius:50%; background:${color}; box-shadow:0 0 8px ${color}; margin-top:5px; position:relative; z-index:2;"></div>
                            <div style="display:flex; flex-direction:column; gap:4px;">
                                <div style="font-size:14px; font-weight:500;">${item.title}</div>
                                <div style="font-size:13px; color:var(--text-muted); line-height:1.5;">${item.desc}</div>
                                <div style="font-size:12px; color:var(--text-muted); opacity:0.7;">${item.time}</div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            }

            simulateStateChange() {
                const bar = document.getElementById('sm-progress');
                if(bar) bar.style.width = '75%';
                
                const nodeImplementing = document.getElementById('node-implementing');
                if(nodeImplementing) {
                    nodeImplementing.classList.remove('active'); nodeImplementing.classList.add('done');
                    nodeImplementing.innerHTML = '<div class="sm-circle"><i class="ph-bold ph-code"></i></div><div style="font-size:12px; margin-top:8px; color:var(--text-main);">实施中</div>';
                }
                const nodeCompleted = document.getElementById('node-completed');
                if(nodeCompleted) nodeCompleted.classList.add('active');

                Database.timeline.unshift({ type: 'success', title: '状态变更: 实施中 -> 已完成', desc: '模拟交互：变更单流转测试完成。', time: '刚刚' });
                this.renderTimeline();
                this.showModal("模拟流转成功！", "状态机已流转至【已完成】。在真实应用中，这会向 Git 触发自动 Commit 并修改 PM_SESSION.md。");
            }

            // --- [3] 变更中心逻辑 ---
            init_changes() {
                const tbody = document.getElementById('changes-tbody');
                let html = '';
                Database.changes.forEach(c => {
                    let btnColor = c.tag === 'primary' ? 'var(--primary)' : (c.tag === 'success' ? 'var(--success)' : 'var(--warning)');
                    html += `
                        <tr onclick="app.showChangeDetail('${c.id}')">
                            <td style="font-family:monospace; font-size:13px;">${c.id}</td>
                            <td style="font-weight:500;">${c.title}</td>
                            <td><span class="tag" style="border:1px solid ${btnColor}; color:${btnColor};">${c.status}</span></td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            }

            showChangeDetail(id) {
                const change = Database.changes.find(c => c.id === id);
                const detailView = document.getElementById('change-detail-view');
                if(change && detailView) {
                    detailView.innerHTML = `
                        <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--glass-border); padding-bottom:16px;">
                            <div>
                                <h2 style="margin-bottom:8px;">${change.id}</h2>
                                <p style="color:var(--text-main); font-size:18px;">${change.title}</p>
                            </div>
                            <span class="tag" style="background:var(--primary); height:24px; border-radius:4px; font-size:12px; display:flex; align-items:center;">${change.status}</span>
                        </div>
                        <div style="color:var(--text-muted); line-height:1.6; font-size:14px; display:flex; flex-direction:column; gap:12px;">
                            <p><strong>负责人:</strong> ${change.author}</p>
                            <p><strong>创建时间:</strong> 2026-07-06</p>
                            <p><strong>描述信息:</strong> 这是一个用于演示左侧列表点击联动的详细信息面板。当对接真实 Python Bridge 后，这里将渲染 Markdown 解析后的详细工单内容。</p>
                        </div>
                        <div style="margin-top:auto; text-align:right;">
                            <button class="btn btn-outline" style="margin-right:8px;">撤销 / 挂起</button>
                            <button class="btn">审核通过</button>
                        </div>
                    `;
                }
            }

            // --- [4] 规范检查逻辑 (LSP) ---
            init_specs() {
                const tbody = document.getElementById('specs-tbody');
                let html = '';
                Database.specs.forEach(s => {
                    const isError = s.status === 'error';
                    const tagClass = isError ? 'tag error' : 'tag success';
                    const tagText = isError ? '违规' : '通过';
                    const actionBtn = isError ? `<button class="btn btn-outline" style="padding:4px 8px; font-size:12px;" onclick="app.showModal('一键修复', '模拟向 TIA Portal OpenAPI 发送重命名指令...')"><i class="ph-bold ph-wrench"></i> 修复</button>` : `<span style="color:var(--text-muted)">-</span>`;
                    
                    html += `
                        <tr>
                            <td style="font-family:monospace; font-size:13px; color:${isError ? 'var(--danger)' : 'var(--text-muted)'};">${s.rule}</td>
                            <td style="font-size:13px; font-weight:500;">${s.desc}</td>
                            <td style="font-size:13px; color:var(--text-muted);">${s.loc}</td>
                            <td><span class="${tagClass}">${tagText}</span></td>
                            <td>${actionBtn}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            }

            runSpecScan() {
                const btn = document.getElementById('btn-scan');
                const bar = document.getElementById('scan-bar');
                const pct = document.getElementById('scan-pct');
                
                btn.innerHTML = `<i class="ph-bold ph-spinner" style="animation: spin 1s linear infinite;"></i> 扫描中...`;
                bar.style.width = '0%';
                bar.style.background = 'var(--primary)';
                pct.innerText = '0% (扫描中)';
                
                setTimeout(() => { bar.style.width = '40%'; pct.innerText = '40% (检查 SCL 语法)'; }, 500);
                setTimeout(() => { bar.style.width = '80%'; pct.innerText = '80% (连接 TIA Openness)'; }, 1000);
                setTimeout(() => {
                    bar.style.width = '100%';
                    bar.style.background = 'var(--warning)';
                    pct.innerText = '100% (发现 2 项违规)';
                    btn.innerHTML = `<i class="ph-bold ph-play"></i> 重新扫描`;
                }, 1500);
            }

            // --- [5] 模板管理逻辑 ---
            init_templates() {
                const grid = document.getElementById('templates-grid');
                let html = '';
                Database.templates.forEach(t => {
                    html += `
                        <div class="glass-panel card-file">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                <div style="width:48px; height:48px; border-radius:12px; background:rgba(99,102,241,0.1); display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:28px;">
                                    <i class="ph-fill ${t.icon}"></i>
                                </div>
                                <span class="tag">${t.type}</span>
                            </div>
                            <h3 style="font-size:16px; margin-top:8px;">${t.name}</h3>
                            <p style="font-size:13px; color:var(--text-muted); line-height:1.5;">${t.desc}</p>
                            <button class="btn btn-outline" style="margin-top:auto; width:100%; justify-content:center;" onclick="app.showModal('生成文档', '已将模板拷贝至当前项目根目录。')">
                                <i class="ph-bold ph-download-simple"></i> 生成到工作区
                            </button>
                        </div>
                    `;
                });
                grid.innerHTML = html;
            }

            // --- [6] 设置逻辑 ---
            init_settings() {}

            // --- 公共功能 ---
            showModal(title = "提示", body = "") {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-body').innerText = body;
                this.modal.classList.add('active');
            }

            closeModal(e) {
                if (e && e.target !== this.modal) return; 
                this.modal.classList.remove('active');
            }
        }

        // --- 全局注入样式动画 ---
        const style = document.createElement('style');
        style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
        document.head.appendChild(style);

        // 启动应用
        const app = new Application();
    </script>
</body>
</html>
