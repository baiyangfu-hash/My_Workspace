[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-var-parser"
version = "1.1.0"
description = "PLC变量表解析工具 - 支持接口文档INT.md解析与Excel导出"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "SW-2026-001团队"}
]
dependencies = [
    "chardet>=5.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
plc-var-parser = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
