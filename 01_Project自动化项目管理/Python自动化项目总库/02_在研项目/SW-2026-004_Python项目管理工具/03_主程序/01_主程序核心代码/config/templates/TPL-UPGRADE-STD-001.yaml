id: TPL-UPGRADE-STD-001
name: 系统升级改造
version: V1.0.0
compiler: Multi
scene: 现有系统升级改造项目
description: 包含现状评估、升级方案、回滚方案的标准改造升级模板
is_builtin: true
business_lines:
- XT
structure:
- path: 00_项目管理/01_现状评估
  required: true
  description: 现有系统评估报告
- path: 00_项目管理/02_升级方案
  required: true
  description: 升级方案设计书
- path: 00_项目管理/03_回滚方案
  required: true
  description: 回滚预案
- path: 00_项目管理/04_实施记录
  required: true
  description: 升级实施过程记录
- path: 00_项目管理/05_变更管理
  required: true
  description: 改造期间变更管理
- path: 10_技术设计/差异分析
  required: true
  description: 新旧系统差异对比
- path: 20_软件程序/新旧程序对照
  required: true
  description: 程序迁移对照表
- path: 40_交付与文档/验收确认
  required: true
  description: 升级后验收确认
- path: 90_知识库/遗留问题
  required: false
  description: 已知遗留问题追踪
templates:
- path: .gitignore
  type: config
  content: |
    # Upgrade Project
    *.bak
    *~
    *.log
    old_version/
    backup/
- path: README.md
  type: document
  spec_id: SPEC-DOC-README-001
  content: |
    # {project_name}

    - **编号**: {project_code}
    - **模板**: TPL-UPGRADE-STD-001 (系统升级改造)
    - **负责人**: {manager}
    - **日期**: {create_date}

    {description}
- path: 00_项目管理/01_现状评估/{project_code}_现状评估报告.md
  type: document
  content: |
    # {project_name} 现状评估报告

    ## 1. 现有系统概况
    ## 2. 存在问题清单
    ## 3. 性能瓶颈分析
    ## 4. 改造必要性评估
    ## 5. 风险评估
- path: 00_项目管理/02_升级方案/{project_code}_升级方案设计书.md
  type: document
  content: |
    # {project_name} 升级方案设计书

    ## 1. 升级目标
    ## 2. 技术方案
    ## 3. 实施步骤
    ## 4. 时间计划
    ## 5. 资源需求
    ## 6. 预算估算
    ## 7. 回滚预案
- path: 00_项目管理/03_回滚方案/{project_code}_回滚预案.md
  type: document
  content: |
    # {project_name} 回滚预案

    ## 触发条件
    ## 回滚步骤
    ## 回滚时间窗口
    ## 数据备份策略
    ## 验证方法
- path: 00_项目管理/04_实施记录/{project_code}_实施日志.md
  type: document
  content: |
    # {project_name} 升级实施日志

    | 日期 | 步骤 | 执行人 | 结果 | 问题 |
    |------|------|:------:|:----:|------|
- path: 40_交付与文档/验收确认/{project_code}_升级验收确认.md
  type: document
  content: |
    # {project_name} 升级验收确认

    ## 功能验证
    ## 性能对比(升级前vs升级后)
    ## 用户签字确认
    ## 移交清单
schema_version: '1.0'
base_template_id: null
