[project]
name = "plc-project-mgr"
version = "9.0.0"
description = "PLC项目管理工具 — 项目看板 + 变更管理"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "fubai"}]
dependencies = []

[project.optional-dependencies]
ui = ["pywebview>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[project.scripts]
plc-mgr = "cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
