[project]
name = "pm-mgr"
version = "0.1.0"
description = "pm-workflow 项目工作流工具链 CLI"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
]

[project.scripts]
pm-mgr = "pm_mgr.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
