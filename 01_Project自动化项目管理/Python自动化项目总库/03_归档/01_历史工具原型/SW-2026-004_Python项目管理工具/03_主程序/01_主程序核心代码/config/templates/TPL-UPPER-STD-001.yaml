id: TPL-UPPER-STD-001
name: 上位机/数据系统
version: V1.0.0
compiler: Flask/Django / Python
scene: 上位机/MES/数据采集/可视化系统
description: 纯软件Python项目，含API接口、数据库、前端展示，适用于数据采集/MES/Web应用
is_builtin: true
business_lines:
- SW
structure:
- path: 00_项目基础信息
  required: true
  description: 立项表、需求
- path: 01_项目文档
  required: true
  description: 设计文档、API文档
- path: 02_需求设计
  required: true
  description: 需求、架构、DB设计
- path: 03_主程序/01_主程序核心代码/src
  required: true
  description: 源代码
- path: 03_主程序/01_主程序核心代码/tests
  required: true
  description: 测试代码
- path: 03_主程序/01_主程序核心_code/config
  required: false
  description: 配置文件
- path: 04_变更管理
  required: true
  description: 变更管理(V2.1.0)
- path: 06_测试相关/01_测试用例
  required: true
  description: 测试用例
- path: 06_测试相关/02_测试报告
  required: true
  description: 测试报告
- path: 07_部署文档
  required: true
  description: 部署指南、运维手册
- path: 19_交付物
  required: true
  description: 可交付成果
templates:
- path: .gitignore
  type: config
  content: |
    # Python
    __pycache__/
    *.py[cod]
    *$py.class
    *.so
    build/
    dist/
    *.egg-info/

    # IDE
    .vscode/
    .idea/

    # Env
    .env
    .venv/

    # Data
    *.csv
    *.db

    # Logs
    *.log
    logs/
- path: README.md
  type: document
  spec_id: SPEC-DOC-README-001
  content: |
    # {project_name}

    - **编号**: {project_code}
    - **模板**: TPL-UPPER-STD-001 (上位机/数据系统)
    - **负责人**: {manager}
    - **日期**: {create_date}

    {description}

    ## 快速开始
    ```bash
    pip install -r requirements.txt
    python main.py
    ```
- path: 00_项目基础信息/0-项目立项表_PROJ.md
  type: document
  spec_id: SPEC-DOC-INIT-001
  content: "# {project_name} 项目立项表\n\n| 项目 | 内容 |\n|------|------|\n| 编号 | {project_code}\
    \ |\n| 名称 | {project_name} |\n| 业务线 | 软件开发(SW) |\n| 负责人 | {manager} |\n| 日期 |\
    \ {create_date} |\n| 使用模板 | {template_id} ({template_name}) |\n\n## 技术栈\n- 语言:\
    \ Python 3.x\n- 框架: \n- 数据库: \n- 部署: \n\n## 核心目标\n{description}\n"
- path: 01_项目文档/1-需求分析文档_REQ.md
  type: document
  spec_id: SPEC-DOC-REQ-001
  content: |
    # {project_name} 需求分析

    ## 功能需求
    ### API接口
    ### 数据处理
    ### 可视化

    ## 非功能需求
    ### 性能
    ### 安全
    ### 兼容性
- path: 03_主程序/01_主程序核心代码/main.py
  type: code
  content: |
    #!/usr/bin/env python3
    # -*- coding: utf-8 -*-
    """
    {project_name}
    Version: V1.0.0
    Date: {create_date}
    """

    def main():
        print("{project_name} starting...")

    if __name__ == "__main__":
        main()
- path: 03_主程序/01_主程序核心_code/requirements.txt
  type: config
  content: |
    # {project_name} Dependencies
    # Core
    flask>=3.0
    sqlalchemy>=2.0

    # Dev
    pytest>=7.4
    black>=24.0
- path: 03_主程序/01_主程序核心_code/src/__init__.py
  type: code
  content: |
    # -*- coding: utf-8 -*-
    """{project_name} src package"""
    __version__ = "1.0.0"
- path: 07_部署文档/部署指南.md
  type: document
  content: |
    # {project_name} 部署指南

    ## 环境准备
    ## 安装步骤
    ## 配置说明
    ## 启动/停止
    ## 监控
schema_version: '1.0'
base_template_id: null
