id: TPL-FULLLINE-AUTO-001
name: 自动化整线项目
version: V1.0.0
compiler: Step7/TIA Portal + Python
scene: 多PLC协同自动化整线项目
description: 包含PLC、HMI、机器人、上位机、Eplan电气、机械设计、通讯协议的完整整线结构
is_builtin: true
business_lines:
- ZD
- DJ
structure:
- path: 00_项目管理/01_立项与需求
  required: true
  description: 立项表、需求分析
- path: 00_项目管理/02_进度与风险
  required: true
  description: 进度计划、风险管理
- path: 00_项目管理/04_变更管理/01_变更单/CHG-PLC
  required: true
  description: PLC类变更单
- path: 00_项目管理/04_变更管理/01_变更单/CHG-ELEC
  required: false
  description: 电气类变更单
- path: 00_项目管理/04_变更管理/01_变更单/CHG-MECH
  required: false
  description: 机械类变更单
- path: 00_项目管理/05_资源管理
  required: true
  description: 资源分配、成本预算
- path: 10_技术设计/11_Eplan电气/Export_PDF
  required: true
  description: 电气原理图(PDF)
- path: 10_技术设计/11_Eplan电气/Source
  required: true
  description: Eplan源文件
- path: 10_技术设计/12_机械结构/3D_Models
  required: true
  description: 3D模型和BOM
- path: 10_技术设计/12_机械结构/2D_Drawings
  required: false
  description: 2D工程图
- path: 10_技术设计/13_通讯与协议
  required: true
  description: 通讯配置和协议文档
- path: 20_软件程序/21_PLC_Autoshop/Source
  required: true
  description: PLC源代码(Autoshop)
- path: 20_软件程序/21_PLC_Autoshop/ST结构文本
  required: true
  description: SCL结构文本(可编译)
- path: 20_软件程序/21_PLC_Autoshop/Docs
  required: true
  description: PLC设计文档(IO分配/架构/联锁)
- path: 20_软件程序/22_HMI_ProFace/Source
  required: false
  description: HMI源文件
- path: 20_软件程序/22_HMI_ProFace/Docs
  required: false
  description: HMI设计文档
- path: 20_软件程序/23_机器人程序
  required: false
  description: 机器人控制程序
- path: 20_软件程序/24_上位机与脚本/Python_Scripts
  required: false
  description: 上位机Python脚本
- path: 30_设备配置/驱动器参数
  required: true
  description: 变频器/伺服驱动参数表
- path: 30_设备配置/智能模块配置
  required: true
  description: 远程IO/安全模块配置
- path: 40_交付与文档/41_操作手册
  required: true
  description: 设备操作手册
- path: 40_交付与文档/43_验收清单
  required: true
  description: 验收检查表(FAT/SAT)
- path: 40_交付与文档/44_培训资料
  required: true
  description: 培训记录和教材
- path: 40_交付与文档/45_故障排查指南
  required: true
  description: 故障排除手册
- path: 40_交付与文档/46_维护计划
  required: true
  description: 维护手册和备件清单
- path: 07_交付文档/04_项目总结报告
  required: true
  description: 项目总结和经验教训
- path: 90_知识库_本项目
  required: false
  description: 项目知识库(选型/最佳实践/避坑指南)
templates:
- path: .gitignore
  type: config
  content: |
    # PLC Project
    *.zap
    *.zap16
    *.ap16
    *.ap19

    # Eplan
    *.elk
    *.zkp

    # Backup
    *.bak
    *~

    # Logs
    *.log
    logs/

    # OS
    .DS_Store
    Thumbs.db
- path: README.md
  type: document
  spec_id: SPEC-DOC-README-001
  content: |
    # {project_name}

    ## 项目信息
    - **编号**: {project_code}
