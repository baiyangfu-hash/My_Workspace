[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plc变量表解析工具"
version = "1.0.0"
description = "多格式PLC变量表解析与转换工具，支持AutoShop/CODESYS/Work3格式"
authors = [
    { name = "fubai" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "click>=8.1",
    "rich>=14",
    "pyyaml>=6.0",
]

[project.urls]
homepage = "https://github.com/fubai/plc变量表解析工具"
source = "https://github.com/fubai/plc变量表解析工具"

[project.scripts]
plc变量表解析工具 = "plc变量表解析工具.cli.__main__:cli"

[dependency-groups]
dev = [
    "mypy>=1,<2",
    "pre-commit>=3,<4",
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.5,<0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["plc变量表解析工具"]

[tool.mypy]
strict = true
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "plc变量表解析工具",
]
testpaths = ["tests"]
addopts = [
    "--cov=plc变量表解析工具/",
    "--cov-report=term",
    "--cov-report=html:coverage/html",
    "--color=yes",
]

[tool.coverage.run]
omit = [
    "tests/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]
