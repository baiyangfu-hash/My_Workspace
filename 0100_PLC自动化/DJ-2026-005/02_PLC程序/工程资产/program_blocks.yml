  - name: "FB_1003_PickPlace_BufferFraming"
    type: "FB"
    path: "02_PLC程序/PLC_ST/pickplace/FB_1003_PickPlace_BufferFraming.scl"
    responsibility: "取放料控制（Z+X1+夹爪协同6步状态机）"
